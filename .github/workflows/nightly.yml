name: nightly
# What is too slow or too platform-specific for every push: the land gate on macOS, and a short
# fuzz run of the decoders. Nightly and on demand, never on push: a failure here is a finding to
# file, not a reason to block an unrelated change.
on:
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Development runs on macOS too (AGENTS.md); `just check` skips ledger-fresh there, since the
  # ledger names Linux-only tests.
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - run: just check

  # About ten minutes per LTX and WAL decoder target from the committed corpus (docs/fuzzing.md);
  # the 24-hour run stays a manual one. A crash, leak, timeout or out-of-memory input is
  # uploaded; replay it with `cargo +nightly fuzz run <target> --fuzz-dir fuzz <file>`.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [decode, index, wal]
    steps:
      - uses: actions/checkout@v5
      # cargo-fuzz needs nightly; the workspace's pinned toolchain is left as it is.
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz,just
      - run: just fuzz "$TARGET" 600
        env:
          TARGET: ${{ matrix.target }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
