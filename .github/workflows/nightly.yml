name: nightly
# What is too slow or too platform-specific for every push: the land gate on macOS, a short fuzz
# run of the decoders, the sanitizers, Miri and schedule exploration. Nightly and on demand,
# never on push: a failure here is a finding to file, not a reason to block an unrelated change.
on:
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ci

jobs:
  # Development runs on macOS too (AGENTS.md); `just check` skips upstream-test-map-fresh there, since the
  # test map names Linux-only tests.
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - run: just check

  # The engine's tests built with the release profile's code generation (`just test-release-opt`):
  # a miscompile that opt-level 1 in the land gate does not show can still change what the shipped
  # binary does. A failure is a finding to file (docs/decisions/D187.md).
  test-release-opt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - run: just test-release-opt

  # From the committed corpus (docs/fuzzing.md): about ten minutes per LTX and WAL decoder
  # target, five per restore-planner target judged by the contract spec; the 24-hour run stays a
  # manual one. A crash, leak, timeout or out-of-memory input is uploaded; replay it with
  # `just fuzz-replay <target> <file>`.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: decode, seconds: 600 }
          - { target: index, seconds: 600 }
          - { target: wal, seconds: 600 }
          - { target: plan_contract, seconds: 300 }
          - { target: plan_lazy, seconds: 300 }
    steps:
      - uses: actions/checkout@v5
      # cargo-fuzz needs nightly; the workspace's pinned toolchain is left as it is.
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz,just
      - run: just fuzz "$TARGET" "$DURATION"
        env:
          TARGET: ${{ matrix.target }}
          DURATION: ${{ matrix.seconds }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  # The memory gates at scale (`just mem-big`): restore peak heap flat from a 1 GiB to a 4 GiB
  # database, the snapshot's bytes a page, planning and retention over a million files. Needs
  # 5 GiB of temporary disk, which a hosted runner has.
  mem-big:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - run: just mem-big

  # The large exhaustive planner sweeps (`just plan-exhaustive`): every inventory of up to five
  # files over five transactions, four files over six, and the as-of sweeps over wider ranges. A
  # superset of the small sweeps `just check` runs; minutes in debug, so not on every push.
  plan-exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - run: just plan-exhaustive

  # AddressSanitizer and ThreadSanitizer over the crate with `unsafe` FFI (sqlite) and the replica
  # thread tests (`just asan`, `just tsan`). Nightly only: -Zsanitizer and -Zbuild-std, which
  # needs rust-src. Any report is a defect to fix, with a regression test.
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just "$SANITIZER"
        env:
          SANITIZER: ${{ matrix.sanitizer }}

  # Miri over the pure crates and the core's decision code (`just miri`): undefined behaviour
  # and leaks in code that does no I/O. Tests that need files or FFI are skipped under cfg(miri).
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just miri

  # Shuttle explores thousands of random thread schedules of the replicator's command handshake
  # and the S3 batch's scoped threads (`just shuttle`); pull requests that touch store-s3 or
  # replica run the short version in ci.yml. A failure prints the schedule that replays it.
  shuttle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just shuttle 500000

  # Every planted-bug patch still applies (`just planted-bugs-apply`): seconds, and a stale patch is
  # named here even when the full run below times out. Not in the land gate, so a moved line near a
  # planted site does not block every land; re-express the patch (docs/planted-bugs.md).
  planted-bugs-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just planted-bugs-apply

  # Every defect fixed on main is planted again in a scratch tree and the tests that caught it must
  # fail (docs/planted-bugs.md). A survivor means a test no longer guards its fix; a patch that stops
  # applying means the entry needs re-expressing against the current tree. About 25 minutes cold on
  # a hosted runner (two test builds, eight entries).
  planted-bugs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - run: just planted-bugs

  # The real-SQLite power-loss campaigns (`just power-loss-trials`): 50 seeds of the history rig
  # and 100 of the crash-cycle rig under the block crash law, judged by restores, some made while
  # the loss still holds. Ignored in the gate, which runs a few frozen seeds of each. About two
  # minutes locally; the timeout bounds a hang.
  power-loss-trials:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - run: just power-loss-trials

  # NIGHTLY ONLY, never in the PR gate. The real `lsr replicate` beside a real SQLite writer with
  # its replica on MinIO behind Toxiproxy (`just fault-rig`): kill -9, partitions, slow and cut
  # transfers, LazyFS power loss, a clock step (libfaketime) and the pinned Go Litestream on the
  # same prefix, judged by point-in-time restores (docs/decisions/D195.md). 1,000 cycles take
  # about four hours on a hosted runner; --max-minutes stops starting cycles before the hard
  # timeout, and the summary line says how many ran. Exit 1 is an anomaly (a finding to file),
  # exit 2 a rig failure or a required situation never reached. Evidence is kept on failure.
  fault-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: ./.github/actions/go-compat
      - run: sudo apt-get install -y cmake g++ libfuse3-dev fuse3 libfaketime
      # LazyFS before any step that draws power loss, so no step runs without it.
      - run: uv run scripts/lazyfs.py build
      # The rig's own canary first: planted damage in the replica must be reported, and the
      # known-issue exemption must not hide an anomaly in an untainted segment.
      - run: just fault-rig-canary
      # One plant the LazyFS path should reach (wal-barrier, the plant that just lazyfs-plant is
      # run with), bounded, reported as found or not found and never failing the job. The Linux
      # paths had not run anywhere when this was written; this says whether the rig reaches a defect there.
      - name: plant wal-barrier under power loss, found or not found
        run: |
          set +e
          just fault-rig-plant wal-barrier 60 --menu none,kill9,power-loss --max-minutes 30 2>&1 | tee plant.log
          rc=${PIPESTATUS[0]}
          case "$rc" in
            1) line="PLANT wal-barrier: FOUND" ;;
            0) line="PLANT wal-barrier: NOT FOUND in 60 cycles" ;;
            3) line="PLANT wal-barrier: DID NOT BUILD (a broken plant, not a miss: re-express its patch)" ;;
            *) line="PLANT wal-barrier: rig failed (exit $rc)" ;;
          esac
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^NOT RUN' plant.log >> "$GITHUB_STEP_SUMMARY" || true
          # Found or not found never fails the job; a plant that does not build does.
          [ "$rc" -ne 3 ] || exit 1
          exit 0
      # Anomalies in a segment the Go nemesis touched are known issue #346 and do not fail the
      # run; any other anomaly does. The summary lists the nemeses that did not run.
      - run: |
          set -o pipefail
          just fault-rig 1000 --max-minutes 280 2>&1 | tee fault-rig.log
      - if: always()
        run: grep -E '^(NOT RUN|known:|go-cycle:)' fault-rig.log >> "$GITHUB_STEP_SUMMARY" || true
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fault-rig-${{ github.run_id }}
          path: |
            target/fault-rig/evidence
            target/fault-rig/cycles.jsonl
          if-no-files-found: ignore

  # NIGHTLY ONLY, never in the PR gate. The real `lsr replicate` on LazyFS (`just lazyfs`): power
  # loss by dropped unsynced data and torn WAL writes, judged by restores against the workload's
  # commit log. Hosted Ubuntu runners mount FUSE: LazyFS's own CI mounts it on ubuntu-latest at the
  # commit scripts/lazyfs.py pins. 300 cycles is about 15 minutes; the hard timeout bounds a hang.
  # A failure keeps the evidence (restores that failed, the commit log, engine and LazyFS logs).
  lazyfs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: sudo apt-get install -y cmake g++ libfuse3-dev fuse3
      - run: just lazyfs 300
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lazyfs-${{ github.run_id }}
          path: |
            target/lazyfs/restores
            target/lazyfs/*.log
            target/lazyfs/*.stderr
          if-no-files-found: ignore