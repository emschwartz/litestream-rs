name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ci

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - run: just check

  # Advisories, bans, licenses and sources (deny.toml), over all features.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,just
      - run: just deny

  # Commit subjects follow Conventional Commits (AGENTS.md); pull requests only,
  # since main's history before the rule is not rewritten.
  commit-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just commit-check origin/${{ github.base_ref }}

  # The S3 store against a real server: MinIO in Docker, with the throwaway local credentials
  # already in scripts/minio.sh. Nothing else is configured or reachable.
  test-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - run: just test-s3

  # The pinned Go versions: committed fixtures plus the live tests. The other releases and
  # upstream main run nightly in compat-releases.yml, never here.
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - uses: ./.github/actions/go-compat
      # The alternation runs take one fixed seed here, so a push or pull request never fails on
      # a kill point nobody chose; compat-releases.yml tries a new seed every night.
      - run: just compat
        env:
          LSR_ALTERNATION_SEED: "1"

  # Go and Rust on one S3 bucket: MinIO in Docker, as test-s3, with the throwaway credentials in
  # scripts/minio.sh. The recipe unsets every AWS_* and LITESTREAM_* variable and the tests
  # refuse any endpoint but loopback http, so no real store is reachable from them.
  compat-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - uses: ./.github/actions/go-compat
      - run: just compat-s3


  # Mutation-tests only the lines the pull request changed in lsr-core and lsr-ltx. Fails on a missed
  # mutant that docs/mutants-escapes.txt does not list (docs/mutants.md). Bounded: 40 minutes of
  # mutants (MUTANTS_DIFF_BUDGET) inside the job's 50.
  mutants-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just,cargo-mutants@27.1.0
      - run: just mutants-diff "origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}
          MUTANTS_JOBS: "4"
