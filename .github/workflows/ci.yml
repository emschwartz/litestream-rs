name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ci

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - run: just check

  # Schedule exploration (`just shuttle`) needs its own build (RUSTFLAGS --cfg shuttle), so it is
  # not in `just check`. It runs here only when what it explores changed: the replica thread's
  # command handshake and the S3 batch's scoped threads. Nightly runs 500000 schedules.
  # Not a path-filtered workflow, which would leave a required check pending; the job
  # decides inside, so it always reports.
  shuttle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/$BASE_REF...HEAD" -- crates/store-s3 crates/replica Cargo.lock justfile rust-toolchain.toml; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_REF: ${{ github.base_ref }}
      - if: steps.changed.outputs.relevant == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - if: steps.changed.outputs.relevant == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - if: steps.changed.outputs.relevant == 'true'
        run: just shuttle

  # Advisories, bans, licenses and sources (deny.toml), over all features.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,just
      - run: just deny

  # Commit subjects follow Conventional Commits (AGENTS.md); pull requests only,
  # since main's history before the rule is not rewritten.
  commit-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just commit-check origin/${{ github.base_ref }}

  # The S3 store against a real server: MinIO in Docker, with the throwaway local credentials
  # already in scripts/minio.sh, and Toxiproxy in front of it for the network-fault tests (built
  # from source at a pinned version by scripts/toxiproxy.sh, hence Go). Nothing else is
  # configured or reachable.
  test-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: just test-s3

  # The pinned Go versions: committed fixtures plus the live tests. The other releases and
  # upstream main run nightly in compat-releases.yml, never here.
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - uses: ./.github/actions/go-compat
      # The alternation runs take one fixed seed here, so a push or pull request never fails on
      # a kill point nobody chose; compat-releases.yml tries a new seed every night.
      - run: just compat
        env:
          LSR_ALTERNATION_SEED: "1"
      # A failed alternation keeps its fixture (database, staging, replica and both processes'
      # logs) under the temp directory; uploaded, the failure can be classified afterwards.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: compat-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/lsr-alternation-*
          if-no-files-found: ignore
      # The artifact is not reachable from where failures are triaged; the job log is. The
      # kept database, WAL and wal-index go into the log too, small enough to rebuild from it.
      - if: failure()
        run: ./scripts/print-kept-fixtures.sh
        env:
          LSR_DUMP_LIMIT: "14000000"

  # TEMPORARY, dropped before landing: reruns the alternation that stalled on WalCorrupt
  # (v0.5.18, seed 1) under CPU load until it fails, so the dump above captures the WAL.
  alternation-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - uses: ./.github/actions/go-compat
      - run: ./scripts/build-go-litestream.sh v0.5.18 main
      - run: |
          for _ in 1 2; do (while :; do :; done) & done
          for attempt in $(seq 1 10); do
            echo "attempt $attempt"
            LSR_ALTERNATION_SEED=1 LSR_COMPAT_VERSIONS="v0.5.18 main" cargo nextest run -p lsr-compat \
              --run-ignored all --locked --no-capture \
              -E 'test(=alternation::live::go_and_rust_alternate_on_one_prefix)' || exit 1
          done
      - if: failure()
        run: ./scripts/print-kept-fixtures.sh

  # Go and Rust on one S3 bucket: MinIO in Docker, as test-s3, with the throwaway credentials in
  # scripts/minio.sh. The recipe unsets every AWS_* and LITESTREAM_* variable and the tests
  # refuse any endpoint but loopback http, so no real store is reachable from them.
  compat-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - uses: ./.github/actions/go-compat
      - run: just compat-s3


  # Mutation-tests only the lines the pull request changed in lsr-core and lsr-ltx. Fails on a missed
  # mutant that docs/mutants-escapes.txt does not list (docs/mutants.md). Bounded: 40 minutes of
  # mutants (MUTANTS_DIFF_BUDGET) inside the job's 50.
  mutants-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Four disjoint slices in parallel: a large diff (the witness touched ~1000 lines of boot
    # code) needs more than one job's 40 minutes, and raising the ceiling would only hide that.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just,cargo-mutants@27.1.0
      - run: just mutants-diff "origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}
          MUTANTS_JOBS: "4"
          MUTANTS_SHARD: "${{ matrix.shard }}/4"
