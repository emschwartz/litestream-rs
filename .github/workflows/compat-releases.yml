name: compat-releases
# Every upstream release tag v0.5.N and upstream main, against the Rust port. Nightly and on
# demand, never on push: a failure here is upstream moving (or a Go version the port does not
# yet read), and must not block a push to this repository.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      alternation_seed:
        description: The alternation seed to replay, decimal (empty for this run's id)
        default: ""

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.names.outputs.names }}
    steps:
      - id: names
        run: |
          set -eu
          tags=$(git ls-remote --tags --refs https://github.com/benbjohnson/litestream \
            | sed 's|.*refs/tags/||' | grep -E '^v0\.5\.[0-9]+$' | sort -V)
          names=$(printf '%s\nmain\n' "$tags" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "names=$names" >> "$GITHUB_OUTPUT"

  compat:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.resolve.outputs.names) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - uses: ./.github/actions/go-compat
        with:
          cache: "false"
      - run: just compat-live "$NAME"
        env:
          NAME: ${{ matrix.name }}

  # A tag the compat table does not list needs an era decision there; it was still run by
  # name above, so this only names it.
  tags:
    needs: compat
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - run: just compat-tags

  # Fresh alternation seeds over the pinned builds. Pushes and pull requests run one fixed seed
  # (ci.yml); this run takes its own id as the seed, so every night tries new kill points, and
  # rerunning the job keeps the id, so a rerun replays the same seed. The seed is printed first
  # and, on a failure, is in the job summary with the line that replays it.
  alternation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - uses: ./.github/actions/go-compat
      # The input goes through the environment and is checked to be a number; never shell text.
      - id: seed
        env:
          SEED_INPUT: ${{ inputs.alternation_seed }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          seed="${SEED_INPUT:-$RUN_ID}"
          case "$seed" in
            '' | *[!0-9]*) echo "the alternation seed must be a decimal number" >&2; exit 1 ;;
          esac
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "::notice title=Alternation seed::LSR_ALTERNATION_SEED=$seed (replay: just compat-alternation $seed)"
          printf '### Alternation seed\n\n`LSR_ALTERNATION_SEED=%s`\n' "$seed" >> "$GITHUB_STEP_SUMMARY"
      - run: just compat-alternation "$SEED"
        env:
          SEED: ${{ steps.seed.outputs.seed }}
      - if: failure() && steps.seed.outputs.seed != ''
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: |
          printf '\n**The alternation failed with seed %s.** Replay it with `just compat-alternation %s`.\n' "$SEED" "$SEED" >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Alternation failed::LSR_ALTERNATION_SEED=$SEED (replay: just compat-alternation $SEED)"
