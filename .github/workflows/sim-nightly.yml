name: sim-nightly
# The simulator's rotating seed set. The fixed set runs on every push in ci.yml; this runs new
# seeds every night, derived from the UTC date, so the histories covered keep growing. Nightly
# and on demand, never on push: a failing seed is a finding to file, not a reason to block an
# unrelated change. The failing seed is the end of the log, as the line that replays it.
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to run seeds for
        default: "900"
      day:
        description: The UTC date whose seeds to run, YYYYMMDD (empty for today)
        default: ""
      long_seconds:
        description: How long each large-profile shard runs seeds for
        default: "1200"

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ci

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      # Inputs go through the environment and the test parses them; neither is shell text.
      - run: just sim-nightly "${SECONDS_INPUT:-900}" "${DAY_INPUT:-$(date -u +%Y%m%d)}"
        env:
          SECONDS_INPUT: ${{ inputs.seconds }}
          DAY_INPUT: ${{ inputs.day }}
      # What the night reached, per behaviour-table row and fault class, whether it passed or not.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sim-reach
          path: target/sim-reach.json
          if-no-files-found: warn

  # The large profile (docs/decisions/D277.md): 5,000-step histories with larger transactions, in
  # four shards that run disjoint seeds from the upper half of the night's range. Each shard
  # uploads its own reach; the marks are gated by the job above, not here, since a shard runs
  # tens of seeds.
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/4", "1/4", "2/4", "3/4"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just
      - run: just sim-long "${SECONDS_INPUT:-1200}" "${DAY_INPUT:-$(date -u +%Y%m%d)}" "${SHARD}"
        env:
          SECONDS_INPUT: ${{ inputs.long_seconds }}
          DAY_INPUT: ${{ inputs.day }}
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sim-reach-long-${{ strategy.job-index }}
          path: target/sim-reach-long.json
          if-no-files-found: warn
