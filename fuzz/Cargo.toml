[package]
name = "lsr-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lsr-fuzzing = { path = "../crates/fuzzing" }

# Outside the root workspace (it is `exclude`d there): libFuzzer needs nightly
# and its own profile, and the workspace stays on the pinned stable toolchain.
[workspace]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index"
path = "fuzz_targets/index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan"
path = "fuzz_targets/plan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key"
path = "fuzz_targets/key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wal"
path = "fuzz_targets/wal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan_contract"
path = "fuzz_targets/plan_contract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan_lazy"
path = "fuzz_targets/plan_lazy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flip"
path = "fuzz_targets/flip.rs"
test = false
doc = false
bench = false
