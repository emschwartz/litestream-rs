# Evidence rows as data: what a test has shown about a circumstance, in a form a machine checks.
#
# This is the rows-as-data scheme of the behaviour accounting's closed-world section, started with
# the rows the checker work touched and a few older ones; the behaviour table is still prose and
# moves here row by row. `crates/compat/tests/compat/evidence.rs` checks the file:
#
# - in `just check` (with no listing): ids are unique; a row's mark is derived, never typed: it is
#   tested when any evidence list is non-empty, and then it carries no `none`; a row with empty
#   lists carries `none`, one of the closed list of untested marks; every kill names a ledger
#   entry in docs/planted-bugs.toml whose package is the cited test's, one of whose test filters
#   matches the cited test, and that test is one of the row's own; a tested row has a kill or an
#   `unkilled` reason, never both silent.
# - in `just evidence-fresh` (part of `just check`, which writes `cargo nextest list` to target/):
#   every cited test exists; a row citing an ignored test names the just recipe that runs it in
#   `runs_in`, and that recipe exists; a kill's test is not ignored (the nightly ledger run, `just
#   planted-bugs`, runs no ignored test, so an ignored kill would never be demonstrated).
#
# The nightly ledger run is what makes a kill true: it plants each entry and requires its tests to
# fail. So every tested row with a kill is backed by a planted bug that its cited test kills.
#
#   id          unique; the prefix names the group (CHK: the checkers themselves, BOOT, RUN, ...)
#   circumstance  what happens in the world or the code
#   detected    tests that produce the circumstance and assert the response, each as
#               `<binary id>::<test path>`: the two columns `cargo nextest list --message-format
#               oneline` prints, joined by `::` (the upstream test map's form)
#   survived    tests that judge a restore while the circumstance holds
#   recovered   tests that judge a restore after it cleared
#   none        only when every list is empty: code only | assumed | untested | unknown |
#               known wrong | accepted, undetected
#   runs_in     the just recipe that runs the row's ignored tests
#   unkilled    why a tested row has no planted bug yet; the check prints these
#   [[row.kill]] test = one of the row's tests, plant = a ledger entry name

[[row]]
id = "CHK-1"
circumstance = "A transaction id covers a second commit after a power loss that cut neither commit"
detected = ["lsr-sim::oracle::tests::a_power_loss_that_cut_nothing_covered_does_not_excuse_a_reused_id"]
[[row.kill]]
test = "lsr-sim::oracle::tests::a_power_loss_that_cut_nothing_covered_does_not_excuse_a_reused_id"
plant = "oracle-reuse-after-any-power-loss"

