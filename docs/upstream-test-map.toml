# The upstream test map: every Go test at the pinned upstream commits (litestream
# 041a8c3, ltx v0.5.3), as listed in docs/upstream-test-map/upstream-tests.txt by
# scripts/upstream-tests.sh, mapped to exactly one of:
#   counterpart = "<nextest binary id>::<test path>" (or a list): Rust tests that check
#                 the same behaviour, each one `cargo nextest list` prints;
#   reason      = why the test does not apply (not in v1, a Go-only detail, or covered
#                 differently by a named Rust test); "@<id>" names one of the shared
#                 sentences in [reasons] below;
#   missing     = what a Rust test should check: the work list.
# One table per upstream file; keys are `TestX` or `TestX/subtest` as the script prints
# them. crates/compat/tests/compat/upstream_test_map.rs checks the whole file in `just check`, whose
# `upstream-test-map-fresh` step lists the Rust tests into target/ and checks every counterpart
# against that list; nothing needs regenerating after adding or renaming a Rust test.

# Reasons shared by many entries: `reason = "@<id>"` names one, so rewording it is one edit.
# The test refuses an id that is not defined here and one no entry uses.
[reasons]
go-vfs = "The Go VFS read replica (its hydration, polling, write mode and config) is not in v1 (docs/PLAN.md section 1, 'Not in v1'): the Go VFS stays in use, and the four-direction compat suite checks that it reads Rust replicas."
v03-layout = "The v0.3 generations/ layout (snapshots and WAL segments under generations/) is not in v1 (docs/PLAN.md section 1); Rust reads and writes the v0.5 LTX layout only."
control-socket-cli = "A CLI command that talks to the running daemon over the control socket; the control socket is not in v1 (docs/PLAN.md section 1)."
control-socket-server = "The control socket and its HTTP server (register, unregister, start, stop, sync, info, list, status over the socket) are not in v1 (docs/PLAN.md section 1, 'Not in v1')."
restore-follow = "Restore -follow (a continuously updated local read replica and its TXID file) is a read replica, which is not in v1 (docs/PLAN.md section 1: the Go VFS stays in use for reading)."
watch-dir = "Watching a directory for databases added or removed at run time (`watch: true`) is not in v1: a `dir` entry is scanned once at start and `watch: true` is refused at load (docs/plans/phase-4-sidecar.md, the directory ruling; lsr-config::config::map::watching_a_dir_is_refused_at_load)."
backend-oss = "Alibaba OSS backend: backends other than S3 and a local directory are not in v1 (docs/PLAN.md section 1)."
go-ltx-spill = "Go-only: ltx's spill-to-disk buffering for large encodes and compactions. Rust bounds memory instead: the encoder keeps only the varint index (at most 30 bytes a page, crates/ltx/src/encoder.rs module doc) and compaction streams with a stated bound (lsr-core compact::tests::thirty_two_inputs_of_two_thousand_pages_stay_under_the_stated_bound)."
s3-sse = "S3 server-side encryption (SSE-C, SSE-KMS) is a Go store option v1 does not offer: lsr-store-s3's configuration is endpoint, region, path style and part size (crates/store-s3/src/config.rs module doc), and D6 (docs/PLAN.md section 8) adds nothing beyond what the contract needs."
go-json-methods = "Go-only: encoding/json methods on an ltx type. Rust's ltx types have no JSON form; the CLI renders its own JSON (lsr-cli::cli verify_json_agrees_with_the_library_report)."
backend-nats = "NATS JetStream backend: backends other than S3 and a local directory are not in v1 (docs/PLAN.md section 1)."
backend-sftp = "SFTP backend: backends other than S3 and a local directory are not in v1 (docs/PLAN.md section 1)."
go-url-helper = "Go-only helper with no product behaviour of its own (URL or query-value plumbing in the Go replica-URL parser)."
go-resumable-reader = "Go-only: internal.ResumableReader reopens a long-lived HTTP stream at its offset after a drop. Rust holds no stream: each read is a bounded ranged GET with a deadline (docs/PLAN.md phase 1, restore executor), retried by the retry layer (lsr-store-s3::faults a_truncated_get_is_transient_never_a_short_read, lsr-core retry::tests::read_delete_and_begin_upload_are_retried_too)."
leaser = "Multi-writer leases (the S3 leaser) are not in v1 (docs/PLAN.md section 1); another writer is detected and stops uploads instead (lsr-sim::faults second_writer_mid_run)."
heartbeat = "Heartbeat pings are not in v1 (docs/PLAN.md section 1)."
backend-webdav = "WebDAV backend: backends other than S3 and a local directory are not in v1 (docs/PLAN.md section 1)."
go-context = "Go-only: context.Context cancellation. The Rust core is sans-IO and advances one tick at a time (docs/PLAN.md section 2, goal 5); there is no context to cancel, and shutdown is final_sync with a deadline."
s3-access-points = "S3 access point ARNs are a Go store option v1 does not offer: the one s3:// URL parser refuses them (crates/config/src/map/s3.rs module doc)."
go-slog = "Go-only helper: slog handler setup and source-path cleaning in internal/log.go. The Rust library has no logger; it reports through EventSink events (docs/PLAN.md section 3)."
provider-hosts = "Rust tells apart only Tigris, AWS, R2 and MinIO-like hosts (crates/store-s3/src/config.rs, Provider); any other provider gets the generic S3 behaviour. Go's per-provider host detection and defaults for this provider have no counterpart (v1 targets Tigris, docs/spikes.md)."
backend-gcs = "Google Cloud Storage backend: backends other than S3 and a local directory are not in v1 (docs/PLAN.md section 1)."
go-ltx-error = "Go-only: the LTXError type and its operator hints, which point at `litestream reset` and auto-recover. Auto-recover is not in v1 (docs/PLAN.md section 1); Rust errors are typed enums per crate (lsr-core fault::tests::from_staging_names_the_local_fault_for_every_store_error)."
go-aws-sdk = "Go-only: configuration of the AWS SDK for Go (its retryer, uploader manager, checksum middleware or HTTP client). lsr-store-s3 signs its own requests with rusty-s3 over ureq or reqwest and has no SDK to configure."
go-soak = "A long-running soak of the Go binary (minutes to hours, Docker or cloud credentials). Rust's counterpart is the simulator's nightly rotating seeds (just sim-nightly) and the 72-hour Tigris soak run by hand (docs/plans/phase-3-syncing.md, the Tigris soak); neither is a test in this listing."
go-test-helper = "Go-only: a test of upstream's own integration-test helper code, with no product behaviour behind it."
go-replica-helper = "Go-only helper: Replica.TimeBounds computes a replica's oldest and newest created-at times for restore -timestamp. Rust's as-of planner answers the restore question directly (lsr-core::plan_lazy plan_as_of_equals_the_exact_planner)."
go-file-resolver = "Go-only: resolving a file:// replica path written with the pre-0.5 percent-escaping. The Rust CLI takes a directory path as given."
backend-azure = "Azure Blob Storage backend: backends other than S3 and a local directory are not in v1 (docs/PLAN.md section 1)."
go-reset = "`litestream reset` is one of Go's subcommands v1 does not have (docs/plans/phase-4-sidecar.md, out of scope: only `replicate` is the daemon's; `lsr restore` and `lsr verify` keep their own flags). The replicator recovers from a missing staging directory by itself (lsr-sim::faults meta_dir_deleted_mid_run)."
go-library-api = "Go library API (DB.EnsureExists) with no caller in cmd/ at 041a8c3. A Rust replicator never restores implicitly: restore is the caller's explicit call (lsr-core restore), and starting on a missing database is the caller's choice."
go-ltx-encode = "Go-only: the `ltx encode-db` debugging command (a database file to a snapshot LTX file, written over a chosen output). Rust snapshots only from a live WAL source (lsr-core snapshot::tests::snapshot_equals_model) and has no such command."
go-encoder = "Go-only: the encoder's runtime state machine. Rust's Encoder takes the header in Encoder::new and finish(self) consumes it (crates/ltx/src/encoder.rs), so a page before the header or a call after close does not compile."
event-sink = "The library reports through EventSink events and the health() handle; the sidecar's /metrics renders that handle on each scrape, so there is no collector to keep, reset or delete, and a database's series exist exactly while it is in the daemon (the lsr-sidecar metrics module doc lists every Go series and why)."
go-ltx-pos = "Go-only: ltx.Pos (a TXID and a post-apply checksum) and its text form, used by Go's status output and its v0.3-era position files. Rust keeps positions as typed values (lsr-core position) with no text form."
go-checksum-parse = "Go-only: parsing a checksum from its 16-digit hex text, used by Go's JSON and CLI. Rust never reads a checksum from text; the binary forms are covered by lsr-ltx header and trailer tests."

