# The boundary snapshot after a TRUNCATE checked the database file against the page table, so a
# commit that landed between the last step and the TRUNCATE read as damage.
name = "boundary-snapshot-keeps-page-table"
fix = "claude/boundary-snapshot-pages"
package = "lsr-sqlite"
test_bin = "sqlite"
tests = ["a_commit_between_the_proof_and_the_truncate_is_not_taken_for_damage"]
