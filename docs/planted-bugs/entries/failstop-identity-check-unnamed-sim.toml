# failstop-identity-check-unnamed in the simulator: the run's write gate never names the check.
name = "failstop-identity-check-unnamed-sim"
patch = "failstop-identity-check-unnamed"
fix = "plant"
package = "lsr-sim"
test_bin = "sim"
tests = ["faults::writes_held_while_the_boot_checks_identity"]
unaided_miss = "Fail-stop needs an outage or doubt held past the age bound with the write gate in play, a scenario longer than the swarm's draw; only the named failstop scenarios and lag tests reach it."
