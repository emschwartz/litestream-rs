# The healthy tail's commit lag sees a snapshot whose slices starve the WAL step: each slice is
# within the per-tick bound, but a commit made meanwhile reaches the replica late
# (crates/sim/src/run/tail.rs).
name = "snapshot-slices-starve-the-wal-step-lag"
patch = "snapshot-slices-starve-the-wal-step"
fix = "plant"
package = "lsr-sim"
test_bin = "sim"
tests = ["liveness::commits_made_during_a_large_compaction_reach_the_replica_in_time"]
unaided_miss = "Needs a fault or interleaving at one request or tick (a rejected part, a busy checkpoint, a slice boundary, a second SQLite in the process) that the swarm does not aim at; only a targeted test sets it up."
