# Blind plant 10 of the recall pilot (issue #127): a compaction output the store took and then
# rejected (a digest that does not match) is not deleted, so a listing shows an object that does
# not decode.
name = "compact-rejected-output-kept"
fix = "plant"
package = "lsr-core"
tests = ["maintain::tests::a_rejected_compaction_output_is_deleted_by_the_executor"]
unaided_miss = "The compaction, listing or retention state it breaks needs a backlog, a stale carried listing or a hole in a level that the swarm's short runs do not build; only core unit tests set that state directly."
