# The sync task stays reported as short of staging space after everything staged is on the
# replica, so the copy that did not fit is long gone and health still says the disk is full.
name = "staging-space-report-outlasts-the-copy"
fix = "plant"
package = "lsr-core"
tests = [
    "actor::tests::staging_space::a_copy_that_may_not_fit_is_reported_and_still_runs",
]
unaided_miss = "Its decision (boot judgment, read verdict, identity or counter rule, metric) needs one precise read fault or history at one decision point; the swarm's random faults do not line up on it within its seeds, and a core unit test sets the input directly."
