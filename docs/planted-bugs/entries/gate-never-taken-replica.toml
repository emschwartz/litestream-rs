# gate-never-taken against the library's end-to-end tests: a refusal at boot holds writes in
# health only, and every connection, set up or not, writes on.
name = "gate-never-taken-replica"
patch = "gate-never-taken"
fix = "plant"
package = "lsr-replica"
test_bin = "replica"
tests = [
    "failstop::a_refusal_at_boot_blocks_every_writer_until_the_first_listing",
    "failstop::writes_are_held_while_the_boot_is_pending",
]
