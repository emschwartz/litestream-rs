# The simulator's forcing window forgets an edit of staging at an upload that reaches the engine's
# newest staged file, though staging was wiped under the send and holds nothing: the snapshot the
# next boot takes above the replica over the empty directory is then called needless.
name = "upload-forgets-a-wiped-staging"
fix = "plant"
package = "lsr-sim"
tests = [
    "an_upload_that_leaves_staging_empty_keeps_the_staging_edit",
]
