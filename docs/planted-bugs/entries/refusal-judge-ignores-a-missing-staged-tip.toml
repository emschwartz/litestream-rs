# The runner's judge of a boot's refusal calls staging intact when the refused tip's file is gone
# from it, so a refusal after an operation emptied staging is reported as an engine bug.
name = "refusal-judge-ignores-a-missing-staged-tip"
fix = "feae726f4"
package = "lsr-sim"
test_bin = "sim"
tests = ["restored_staging::staging_emptied_by_an_operation_is_a_cause_for_a_refusal_after_a_newer_snapshot"]
unaided_miss = "The plant sits in the simulator's own judge or model, so the swarm only meets it when a seed makes that judge's exempted case happen; the judge's unit test feeds the case directly."
