# A position at the start of a generation keeps the chain seed of the header it saw, though
# SQLite wrote that header again with the same salts and another checkpoint sequence: the first
# frame fails its checksum and the WAL reads as corrupt for good.
name = "start-seed-from-old-header"
fix = "3b78c876f"
package = "lsr-core"
tests = [
    "a_step_from_the_start_follows_a_header_written_again_with_the_same_salts",
]
unaided_miss = "Its decision (boot judgment, read verdict, identity or counter rule, metric) needs one precise read fault or history at one decision point; the swarm's random faults do not line up on it within its seeds, and a core unit test sets the input directly."
