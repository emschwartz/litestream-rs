# A restore's stream that failed part way is opened again from the object's first byte, so the
# decoder is handed bytes it already had.
name = "stream-resumes-from-the-start"
fix = "claude/restore-requests"
package = "lsr-core"
tests = [
    "retry::tests::a_stream_that_fails_goes_on_from_the_bytes_it_handed_out",
]
unaided_miss = "Its decision (boot judgment, read verdict, identity or counter rule, metric) needs one precise read fault or history at one decision point; the swarm's random faults do not line up on it within its seeds, and a core unit test sets the input directly."
