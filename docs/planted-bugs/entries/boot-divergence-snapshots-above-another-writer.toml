# A boot divergence (the replica's newest file verifies and differs from the staged copy under
# the same key) dropped the staged copy and snapshotted above another writer's file.
name = "boot-divergence-snapshots-above-another-writer"
fix = "68d2d90"
package = "lsr-core"
tests = ["a_running_engine_stops_when_another_writer_took_its_next_id"]
