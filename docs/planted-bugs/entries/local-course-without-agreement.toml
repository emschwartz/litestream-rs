# The local course begins though a staged file did not read whole or did not start where the
# one before it ended: the engine stages and checkpoints from a position staging does not prove.
name = "local-course-without-agreement"
fix = "claude/boot-local"
package = "lsr-core"
tests = [
    "staging_that_does_not_read_whole_begins_no_course",
    "staged_files_that_do_not_chain_begin_no_course",
]
unaided_miss = "The local course needs staging behind the replica with the store down across two restarts and lying reads on return, a history the swarm does not draw; only its explicit scenarios reach it."
