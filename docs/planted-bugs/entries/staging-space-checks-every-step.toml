# The free-space check runs before every sync step, not only before a whole-database copy, so
# every commit's few pages are held against the room a whole copy would need.
name = "staging-space-checks-every-step"
fix = "plant"
package = "lsr-core"
tests = [
    "actor::tests::staging_space::a_step_that_stages_only_commits_is_not_checked",
]
unaided_miss = "The plant costs requests, memory or bytes and changes no restored page; the swarm's oracles judge pages and needless snapshots, not request counts or buffer sizes, and only the cost tests count those."
