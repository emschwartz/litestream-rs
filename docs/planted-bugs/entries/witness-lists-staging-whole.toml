# The boot's pass lists every staged file before it reads the first: a staging directory larger than memory is held whole.
name = "witness-lists-staging-whole"
fix = "3853a92"
package = "lsr-core"
tests = ["the_boot_pass_judges_the_first_staged_file_without_listing_them_all"]
unaided_miss = "The plant costs requests, memory or bytes and changes no restored page; the swarm's oracles judge pages and needless snapshots, not request counts or buffer sizes, and only the cost tests count those."
