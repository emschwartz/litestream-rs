# The boot's read-back reads each level's newest file whole, the level-9 snapshot (the whole
# database) among them: about 16 GB of egress a restart at full size (docs/decisions/D272.md).
name = "read-back-reads-whole-files"
fix = "plant"
package = "lsr-core"
tests = [
    "sliced_snapshot::a_boot_reads_back_only_the_header_and_tail_of_each_newest_file",
]
unaided_miss = "Costs egress bytes only and changes no restored page; the swarm's oracles do not count bytes read, and only the read-back cost test does."
