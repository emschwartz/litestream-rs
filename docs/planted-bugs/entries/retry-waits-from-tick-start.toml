# A retry's wait is timed from when its tick began, not from when the failed call returned: after
# a call that hung past the wait (the S3 client's 60 s deadline), the retry goes at once.
name = "retry-waits-from-tick-start"
fix = "plant"
package = "lsr-core"
tests = [
    "actor::tests::retry_after_hang::a_retry_waits_from_when_the_failed_call_returned",
]
