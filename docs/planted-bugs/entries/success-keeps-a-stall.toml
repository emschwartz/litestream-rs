# The defect the end-of-run stall check exists for, killed by the swarm with nothing written for
# it: a task's success leaves its stall in place, so health says degraded for nothing.
name = "success-keeps-a-stall"
fix = "checker-holes (stall liveness)"
package = "lsr-sim"
test_bin = "sim"
tests = ["a_stall_ends_with_the_fault_that_caused_it_seed_0x2a8"]
