# The similarity bar dropped: a database written after the replica's newest file carries on
# with a snapshot whatever it holds, so an empty or unrelated database becomes the replica's
# newest state.
name = "identity-ahead-bar-dropped"
fix = "plant"
package = "lsr-core"
tests = [
    "ahead::a_new_meta_directory_over_an_unrelated_database_still_stops",
    "ahead::a_four_page_unrelated_database_stops",
    "ahead::a_two_page_database_never_carries_on",
]
unaided_miss = "Its decision (boot judgment, read verdict, identity or counter rule, metric) needs one precise read fault or history at one decision point; the swarm's random faults do not line up on it within its seeds, and a core unit test sets the input directly."
