# An upload grows each part's buffer by doubling from 4 KiB, so every part leaves a ladder of blocks of
# other sizes that macOS keeps mapped: a long upload at a large part size held about its own length.
name = "upload-part-regrown-by-doubling"
fix = "plant"
package = "lsr-store-s3"
test_bin = "store-s3"
tests = [
    "memory::an_upload_through_the_real_client_holds_five_parts",
    "memory::a_long_upload_at_a_large_part_size_holds_one_batch_and_allocates_each_part_once",
]
