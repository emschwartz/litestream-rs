# A compaction output the store refuses (no create-only writes) switches level-0 uploads to
# replacing writes without the upload task saying so: the first replace goes out while health
# says uploads are healthy, which the simulator's judge of D79 fails.
name = "refused-compaction-keeps-uploads-healthy"
fix = "claude/steady-requests"
package = "lsr-core"
tests = ["actor::tests::create_only::a_refused_compaction_output_is_written_again_by_replacing"]
unaided_miss = "Needs a store that refuses a compaction output create-only, then a health read before the first replace; the swarm does not draw a store without create-only writes at that point, and only the create-only test does."
