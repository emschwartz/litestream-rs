# A boot accepts every pending staged file whole as it reads it, whether or not it starts where the
# file before it ended (or at the first frame): a staged file from another place in the WAL goes up.
name = "pending-chain-unchecked"
fix = "plant"
package = "lsr-core"
tests = [
    "a_pending_file_that_skips_a_range_is_refused",
    "a_full_file_that_neither_follows_nor_starts_the_generation_is_refused",
    "a_pending_file_from_elsewhere_in_the_wal_ends_the_run",
]
unaided_miss = "Its decision (boot judgment, read verdict, identity or counter rule, metric) needs one precise read fault or history at one decision point; the swarm's random faults do not line up on it within its seeds, and a core unit test sets the input directly."
