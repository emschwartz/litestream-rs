# The same plant in the simulator, where an application's open write transaction holds the lock
# (no fault injected) and where one is injected.
name = "busy-write-lock-fails-the-checkpoint-sim"
fix = "claude/own-checkpoint"
package = "lsr-sim"
test_bin = "sim"
patch = "busy-write-lock-fails-the-checkpoint"
tests = ["faults::write_lock_held_at_the_barrier", "faults::busy_on_barrier"]
unaided_miss = "Needs a fault or interleaving at one request or tick (a rejected part, a busy checkpoint, a slice boundary, a second SQLite in the process) that the swarm does not aim at; only a targeted test sets it up."
