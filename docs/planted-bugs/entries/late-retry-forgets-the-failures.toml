# A gray failure's plant (docs/decisions/D276.md): a task's run of failures is forgotten when a
# retry comes more than 30 s after its wait ended. With stores that fail at once, every retry
# comes when its wait ends and nothing changes; when each call hangs until the client's 60 s
# timeout, every early retry comes late, the count never reaches the stall threshold, and an
# endpoint that never answers leaves health reporting nothing.
name = "late-retry-forgets-the-failures"
fix = "plant"
package = "lsr-sim"
test_bin = "sim"
tests = [
    "gray::a_store_that_hangs_every_upload_is_reported_degraded",
]
