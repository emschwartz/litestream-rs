# A hole is closed while the level the fill reads or writes holds an output the store
# rejected, which is never an input and goes before anything else at its level.
name = "fill-reads-a-rejected-output"
fix = "claude/level-holes"
package = "lsr-core"
tests = ["maintain::tests::a_fill_waits_for_the_delete_of_a_rejected_output_at_or_below_its_level"]
unaided_miss = "The compaction, listing or retention state it breaks needs a backlog, a stale carried listing or a hole in a level that the swarm's short runs do not build; only core unit tests set that state directly."
