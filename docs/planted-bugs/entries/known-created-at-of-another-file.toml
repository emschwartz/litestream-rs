# A remembered created-at time answers for any listed file that ends at the same
# transaction, whatever its key and length.
name = "known-created-at-of-another-file"
fix = "claude/steady-requests"
package = "lsr-core"
tests = [
    "created_at::tests::a_remembered_put_answers_only_for_the_file_it_was",
]
unaided_miss = "The plant costs requests, memory or bytes and changes no restored page; the swarm's oracles judge pages and needless snapshots, not request counts or buffer sizes, and only the cost tests count those."
