# A read to the end, a restore's, takes a ranged read per 4 MiB chunk, a request each, instead of
# the one stream it opened.
name = "restore-reads-a-request-per-chunk"
fix = "claude/restore-requests"
package = "lsr-core"
test_bin = "core"
tests = [
    "gates::restore_of_a_chain_sends_one_request_per_file",
    "gates::restore_through_the_retry_layer_reads_a_file_in_one_request",
]
unaided_miss = "The plant costs requests, memory or bytes and changes no restored page; the swarm's oracles judge pages and needless snapshots, not request counts or buffer sizes, and only the cost tests count those."
