# The replicator's counter is read and never compared (the same plant as
# identity-counter-ignored): in the simulator's history of an older copy put on a new host, the
# older database snapshots above the replica's newest state and the oracle finds it went back.
name = "identity-counter-ignored-sim"
fix = "plant"
package = "lsr-sim"
tests = [
    "faults::older_copy_on_a_new_host",
]
unaided_miss = "Its decision (boot judgment, read verdict, identity or counter rule, metric) needs one precise read fault or history at one decision point; the swarm's random faults do not line up on it within its seeds, and a core unit test sets the input directly."
