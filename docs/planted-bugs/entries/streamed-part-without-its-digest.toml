# A part whose body is read back from the staged file while it is sent is signed with the hash
# of an empty body in place of the SHA-256 of the bytes first handed over, so the store has
# nothing true to check the bytes it received against (docs/decisions/D222.md, D250.md).
name = "streamed-part-without-its-digest"
fix = "plant"
package = "lsr-store-s3"
test_bin = "store-s3"
tests = ["sourced::every_streamed_request_carries_the_digest_and_length_of_the_first_read"]
