# A part whose body is read back from the staged file while it is sent goes out without
# Content-MD5, so the store has nothing to check the bytes it received against: a second read
# that went wrong on the way would be stored as the part (docs/decisions/D222.md).
name = "streamed-part-without-its-digest"
fix = "plant"
package = "lsr-store-s3"
test_bin = "store-s3"
tests = ["sourced::every_streamed_request_carries_the_digest_and_length_of_the_first_read"]
