# A snapshot for a doubt alone counts as quiet only while the replica holds every staged file, so one staged behind a pending commit dates the clock after that commit lands.
name = "failstop-quiet-snapshot-needs-caught-up"
fix = "claude/age-stop"
package = "lsr-core"
tests = [
    "lag::an_operator_snapshot_behind_a_pending_commit_is_not_lag",
]
unaided_miss = "Fail-stop needs an outage or doubt held past the age bound with the write gate in play, a scenario longer than the swarm's draw; only the named failstop scenarios and lag tests reach it."
