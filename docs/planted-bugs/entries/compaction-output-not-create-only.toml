# A compaction writes its output as a replace without asking about the key first, as Go does,
# so an output a listing did not show is written over.
name = "compaction-output-not-create-only"
fix = "claude/steady-requests"
package = "lsr-core"
tests = [
    "maintain::tests::running_a_job_twice_leaves_one_file_at_the_key",
    "maintain::tests::an_output_key_that_holds_another_file_is_not_written_over",
]
