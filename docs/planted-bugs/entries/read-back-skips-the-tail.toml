# The boot's read-back reads each newest file's header and stops there, so a file cut short
# (a torn upload, page bytes where the trailer belongs) passes.
name = "read-back-skips-the-tail"
fix = "plant"
package = "lsr-core"
tests = [
    "audit::a_newest_file_cut_short_is_caught_and_rebuilt",
    "maintain::audit::tests::a_file_cut_short_fails",
]
unaided_miss = "Needs a newest file cut short at its tail with the header intact, a damage the swarm's damage draw does not aim at; only the audit tests feed it."
