# A level-9 snapshot read from the database is one unit of work again: its first slice reads
# and hands the replica the whole database, so nothing else runs until it ends. The simulator's
# per-tick bound sees it at the large profile.
name = "snapshot-runs-whole"
fix = "plant"
package = "lsr-sim"
test_bin = "sim"
tests = ["liveness::commits_made_during_a_large_compaction_reach_the_replica_in_time"]
