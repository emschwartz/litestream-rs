# An upload is cut at the stall bound in all, as the one end-to-end deadline did, so a part that moves but needs longer fails on every retry.
name = "upload-capped-at-the-stall-bound-ureq"
fix = "claude/part-deadline"
package = "lsr-store-s3"
tests = [
    "ureq_transport::tests::an_upload_that_keeps_moving_outlives_the_stall_bound",
]
