# The boot's read-back of the newest file of each level reads every file whole in one
# maintenance tick, so a level-9 snapshot (the whole database) holds sync and upload until it ends.
name = "read-back-in-one-tick"
fix = "plant"
package = "lsr-core"
tests = [
    "sliced_snapshot::a_boot_reads_back_a_long_snapshot_a_slice_a_tick",
]
unaided_miss = "Needs a fault or interleaving at one request or tick (a rejected part, a busy checkpoint, a slice boundary, a second SQLite in the process) that the swarm does not aim at; only a targeted test sets it up."
