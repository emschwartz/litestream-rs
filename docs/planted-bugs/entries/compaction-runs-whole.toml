# A compaction is one unit of work again: its first slice reads and writes the whole output in one
# tick, so no commit made meanwhile is synced or uploaded until the compaction ends.
name = "compaction-runs-whole"
fix = "plant"
package = "lsr-core"
tests = [
    "actor::tests::sliced_compaction::a_commit_made_during_a_long_compaction_reaches_the_replica_before_it_ends",
]
unaided = 52
