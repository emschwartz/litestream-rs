# A WAL that grew past the application's automatic checkpoint threshold with nothing new
# checkpointed was logged as "the application checkpointed the database", the opposite of what
# was read (docs/decisions/D225.md).
name = "stall-logged-as-app-checkpoint"
fix = "claude/own-checkpoint"
package = "lsr-sidecar"
tests = ["a_stalled_wal_is_not_logged_as_an_application_checkpoint"]
