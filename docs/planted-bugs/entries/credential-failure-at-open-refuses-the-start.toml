# A credential source that fails at start refuses the store again, so the database is never replicated
# until the daemon is restarted.
name = "credential-failure-at-open-refuses-the-start"
fix = "plant"
package = "lsr-config"
tests = [
    "a_source_that_is_down_at_start_opens_a_store_that_asks_again",
]
