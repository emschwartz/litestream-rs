# The scheduled verify calls every transaction without an exact plan "merged by compaction,
# nothing to compare", so a replica that lost the live transaction passes. The simulator's
# verify judge (crates/sim/src/run/verify.rs) catches it unaided at its 13th swarm seed.
name = "verify-no-plan-called-merged"
fix = "plant"
package = "lsr-sim"
test_bin = "sim"
tests = ["verify_reports_a_live_transaction_a_rollback_took_seed_0xd"]
