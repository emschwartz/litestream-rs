# A job's slice that handed bytes over and then found its upload's parts in the way is taken for a
# slice that sent nothing: the tick goes on to other work and hands the replica more than its bytes.
name = "slice-that-sent-takes-no-turn"
fix = "plant"
package = "lsr-core"
tests = [
    "actor::tests::sliced_compaction::a_slice_that_hands_bytes_over_before_it_waits_is_the_ticks_unit",
]
unaided_miss = "Needs a fault or interleaving at one request or tick (a rejected part, a busy checkpoint, a slice boundary, a second SQLite in the process) that the swarm does not aim at; only a targeted test sets it up."
