# The snapshot liveness oracle (crates/sim/src/liveness.rs): every boot snapshots. Every restore
# still matches, so only an oracle that asks why a snapshot was taken can see it. lsr-core's
# actor::tests::nothing_is_pruned_before_the_first_listing and
# actor::tests::pages::a_boot_that_continues_checks_pages_the_last_run_recorded fail on it too.
name = "always-snapshot-at-boot"
fix = "plant"
package = "lsr-sim"
test_bin = "sim"
tests = [
    "liveness::restarts_with_nothing_damaged_never_snapshot",
    "a_torn_staged_file_is_dropped_seed_0x25",
    "a_torn_staged_file_is_dropped_seed_0x2d",
    "a_torn_staged_file_is_dropped_seed_0x46",
    "page_size_vacuum_and_staging_wipe_seed_0x126d68ef545f",
    "a_put_back_staged_file_never_sends_latest_back_seed_0x126d68fae16b",
]
# A failed sync of the WAL taken as a success: the frames it covered are staged, though the
# kernel may never write them. The simulator's lost writeback and its staged-durability check
# see it too (`wal_fsync_fails`), as does the actor's unit test.
