# A tick that held a sync for its interval does not name the interval's end as its wake,
# so a driver that sleeps on the engine's wake stages the commit late or never.
name = "held-sync-names-no-wake"
fix = "claude/steady-requests"
package = "lsr-core"
tests = [
    "actor::tests::steady::a_commit_inside_the_interval_waits_for_it_and_the_tick_names_the_wake",
]
unaided_miss = "Needs a fault or interleaving at one request or tick (a rejected part, a busy checkpoint, a slice boundary, a second SQLite in the process) that the swarm does not aim at; only a targeted test sets it up."
