# Every whole maintenance listing reads all ten levels again, the empty levels above the
# configured top included: five LISTs a whole listing that Go never sends.
name = "whole-listing-reads-empty-levels-above-the-top"
fix = "claude/fewer-lists"
package = "lsr-core"
tests = [
    "actor::tests::levels_above_top::a_first_start_lists_the_levels_above_the_top_once",
    "actor::tests::levels_above_top::a_level_above_the_top_that_holds_a_file_is_listed_by_every_whole_listing",
    "actor::tests::steady::after_the_boot_a_steady_writer_never_lists_the_empty_levels_above_the_top",
]
unaided_miss = "Costs five extra LISTs a whole listing and changes no restored page; the swarm does not count requests, and only the levels-above-top tests do."
