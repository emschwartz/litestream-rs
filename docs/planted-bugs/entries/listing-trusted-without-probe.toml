# A boot or relist takes a listing's newest as the replica's, with no reads past it: a listing
# that lags hides the engine's own uploads.
name = "listing-trusted-without-probe"
fix = "8c7d8ce"
package = "lsr-core"
tests = [
    "a_listing_that_hides_the_newest_uploads_is_corrected_by_reads",
    "a_relist_that_hides_confirmed_uploads_is_no_regression",
    "a_snapshot_a_listing_hides_is_found_by_a_read",
    "the_probe_reads_through_the_newest_staged_transaction",
]
