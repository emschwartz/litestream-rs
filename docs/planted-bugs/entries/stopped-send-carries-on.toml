# Stopping the send in flight hands out its word that no send is reading a staged file, and leaves
# the send where it is: a staged file condemned or deleted after that still has a send, and an
# upload open on the replica, that nothing ends.
name = "stopped-send-carries-on"
fix = "plant"
package = "lsr-core"
tests = [
    "upload::tests::slices::no_staged_file_at_or_past_the_one_in_flight_may_be_deleted_until_the_send_is_stopped",
    "actor::tests::sliced::a_drain_past_its_deadline_aborts_the_file_in_flight",
]
