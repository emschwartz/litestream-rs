# The compactor took its output's commit acknowledgement as given: a store that acknowledged
# the output short left a truncated level-N file, maintenance reported it compacted, and a later
# restore of the latest state could not decode it. Every engine commit is now checked
# (crates/core/src/publish.rs); this patch opens the compactor's upload raw, around the check, which
# the source guard also catches.
name = "compact-commit-unchecked"
fix = "claude/commit-size"
package = "lsr-core"
tests = [
    "compact::tests::an_output_acknowledged_short_is_deleted_and_reported",
    "publish::guard::no_engine_module_calls_a_store_write_or_delete_outside_publish",
]
