[[row]]
table = "Fail-stop"
id = "FS-1"
mark = "none: not yet placed: a row added after the marks; its branches are in lsr-core (actor/lag.rs, failstop.rs, checkpoint.rs) or lsr-replica"
circumstance = "The engine stops for any cause but the end of a drain (`failstop.rs`, `actor/lag.rs`): with the default responses only another writer; any cause set to `stop`"
response = "trip `Stopped(cause)` at once, with no bound; under `hold-start` an application not yet released is held, under `stop-app` a running one is stopped, under `report` nothing is held"
signal = "`/healthz` 503 with `held_by` the stop's cause name and `app` = `held`, log `start refused` or `app stopped`"
at_risk = "What the stop itself leaves off the replica. Known limits in the library: commits are refused only on connections `app_connection` set up whose hook is still the gate's, so these writers are not stopped and nothing reports it: a connection not set up through it, one whose application set a commit hook afterwards (SQLite allows one hook per connection and has no read-back), another SQLite library in the process, and another process writing the database; the sidecar's `stop-app` stops only its `-exec` child (decision D82)"
recovery = "Operator: fix the cause (or `lsr take-over`), restart"
detected_by = "core::`an_unsafe_stop_trips_and_a_drain_does_not`, core::`a_stop_trips_and_wins`, core::`the_gate_follows_the_table`, core::`the_release_latches`, replica::`an_unsafe_stop_while_running_refuses_commits_only_under_stop_app`, cli::`an_unsafe_stop_at_boot_holds_the_child`, cli::`an_unsafe_stop_while_running_stops_the_child_under_stop_app`, plant::`failstop-starts-over-a-stop`, plant::`failstop-exec-ignores-the-gate`, plant::`failstop-stop-app-never-stops`"
notes = "Another writer's boot stop from #110 is covered by the same trip with no code of its own"

[[row]]
table = "Fail-stop"
id = "FS-2"
mark = "none: not yet placed: a row added after the marks; its branches are in lsr-core (actor/lag.rs, failstop.rs, checkpoint.rs) or lsr-replica"
circumstance = "A commit has been off the replica for `max-unreplicated-age` (10 minutes, at least 5), and a sync or upload attempt made at or after the bound failed. The clock is the oldest date of what is off the replica now: a pending file's stamp, or when this process first saw unstaged WAL frames (carried to the first file they went into until the replica holds it), never the start of an unbroken run of lag (decision D85); at the bound the sync and upload waits are let go once, the probe"
response = "trip `UnreplicatedTooLong`; held only under `stop-app` (decision D17); clears once the commits it tripped on reach the replica, not only at zero age (decision D86)"
signal = "`/healthz` 503, `held_by` = `unreplicated_too_long`; `lsr_unreplicated_age_seconds`"
at_risk = "Commits newer than the bound, until uploads land. Known limits in the library: commits are refused only on connections `app_connection` set up whose hook is still the gate's, so these writers are not stopped and nothing reports it: a connection not set up through it, one whose application set a commit hook afterwards (SQLite allows one hook per connection and has no read-back), another SQLite library in the process, and another process writing the database; the sidecar's `stop-app` stops only its `-exec` child (decision D82)"
recovery = "Automatic once uploads land"
detected_by = "core::`a_store_down_past_the_bound_trips_at_the_probe`, core::`a_trip_for_age_clears_once_caught_up`, core::`a_steady_writer_whose_uploads_trail_by_a_tick_never_trips`, core::`failstop::tests::a_trip_for_age_clears_once_its_commits_land`, core::`failstop::tests::staged_frames_never_date_a_newer_file`, core::`failstop::tests::staged_frames_carry_their_date_until_the_replica_holds_them`, sim::`a_store_down_past_the_bound_trips_in_time_and_clears_after`, sim::`seed_0x330_does_not_trip`, sim::`seed_0x9f9_does_not_trip`, sim::`seed_0xa4d_does_not_trip`, plant::`failstop-never-trips`, plant::`failstop-no-probe`, plant::`failstop-no-clear`, plant::`failstop-clock-from-last-failure`, plant::`failstop-dates-the-run`, plant::`failstop-carried-outlives-its-file`, plant::`failstop-carries-to-the-newest-file`, plant::`failstop-trip-held-to-zero-age`"
recovered_by = "sim::`a_store_down_past_the_bound_trips_in_time_and_clears_after`"

