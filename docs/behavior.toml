[[row]]
table = "Circumstances the code does not distinguish"
id = "WORLD-41"
circumstance = "A deploy replaces the machine and keeps the volume (fly.io): every deploy restarts the replicator on the same database and meta directory, maybe with another binary, ending in SIGTERM (the app's connections close, final sync, the replicator's close is SQLite's last, exit) or SIGKILL during the final sync"
response = "Each boot continues from staging: no snapshot, no stop. Two cases snapshot and never stop: an app connection that closes after the replicator's, in process or beside a sidecar, whose close deletes the WAL (`WalMissing`, BOOT-7; only the replicator's own connections set `PERSIST_WAL`, D123); a kill right after the engine's own checkpoint let the WAL restart, before the new generation's first file was staged (`StagedUnverified`, BOOT-11: the proof lives in memory)"
signal = "none; or the snapshot's cause"
at_risk = "None"
recovery = "Automatic"
detected_by = "sim::`deploy_cycle_after_sigterm`, sim::`deploy_cycle_after_sigkill`, sim::`deploy_cycle_with_the_wal_deleted_at_close`, sim::`deploy_cycle_sigkill_after_a_wal_restart_snapshots`, replica::`deploy::deploys_ending_in_sigterm_continue_with_no_snapshot_and_no_stop`, replica::`deploy::deploys_killed_during_the_final_sync_continue_with_no_snapshot_and_no_stop`, replica::`deploy::a_deploy_whose_application_closes_last_snapshots_once_and_does_not_stop`"
recovered_by = "sim::`deploy_cycle_after_sigterm`, sim::`deploy_cycle_after_sigkill`"
notes = "The replica tests run each deploy as a real child process and kill it with SIGKILL. The replica is never ahead of staging after a kill: uploads come only from staging and prune keeps the newest staged file. The snapshot after a kill near a WAL restart needs the checkpoint proof to outlive the process (the engine journal)"


[[row]]
table = "Circumstances the code does not distinguish"
id = "WORLD-42"
circumstance = "A restore of `Latest` or `AsOf` lists through a lagging listing, and more than 3 transactions in a row right after the listing's end have no key a reader can name: a hole a bucket rollback left while the writer went on above it (issue #99's mid-run rollback item), or a narrower hole followed by a merged file whose level-0 inputs are gone and which starts where the hole ends"
response = "**Trusted.** The walk past the listing stops after 3 missing transactions in a row, so no key past the hole is read, and a snapshot `1-N` past it cannot be named. The listing's chain is published as the newest"
signal = "none"
at_risk = "A committed but older state returned as `Latest` with success, while the replica's newest is past the hole. Breaks the rule that a request that cannot be met exactly is an error. Bound: more than 3 unnameable transactions in a row next to what the listing shows, and a listing that hides everything past them; fewer is WORLD-4 and fails `ListingBehind`"
recovery = "Run again once the listing catches up"
detected_by = "core::`a_hole_wider_than_the_walk_past_a_lagging_listing_still_hides_the_newest`"
no_test = "known wrong"
notes = "The cited test pins the residue: it asserts the older state is published. Found by the simulator's overlapping lagging-listing hold (seed 0x7f8 on the overlapping-faults branch: a hole from 0x22 to 0x72, then level-0 files and a snapshot past it; seed 0x593 of the mixed set: a one-id hole at 0x97, then a merged level-1 file 98-9f whose level-0 inputs are gone, and level 0 from 0x9b). Naming a start after each missing transaction would not reach 0x593, whose first nameable key is the fifth past the listing; the hold counts it as `hold.LaggingListing.past_hole`. A snapshot pointer a restore could read past any hole is D61 in `docs/decisions.md`, an open question for the owner (issue #169); nothing is built"
