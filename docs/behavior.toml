notes = "The cited test pins the residue: the newer file stays unnamed. Residue of BOOT-18's level keys, accepted with them (D60 in `docs/decisions.md`, open to owner review)"
[[row]]
table = "Boot"
id = "BOOT-31"
circumstance = "A boot restores a WAL-sync debt from the engine journal while the WAL is still the newest staged file's generation, and database-file pages no WAL frame covers are not their images at the newest staged transaction: a checkpoint copied frames the failed sync covered, and a power loss or eviction then lost them from the WAL (`core/src/ahead.rs`, `docs/decisions.md` D103)"
response = "The first sync step after boot is the check, before the TRUNCATE. A clean file: the TRUNCATE and the snapshot follow as in RUN-3. Pages that differ: the verdict is journalled, the file is replicated as the application serves it, the sync task is degraded at `DatabaseAheadOfWal` until the cure's next step succeeds (under `STRICT`: stop, once), and retention keeps the newest staged transaction for seven days"
signal = "`database_ahead_of_wal` in `Health.degraded` while degraded, then `Health.ahead_of_wal`, `/healthz` `database_ahead_of_wal` and `lsr_database_ahead_of_wal` until the window ends; the degraded event logged at error level, a boot inside the window and the window's end logged (`Event::AheadOfWal`, `Kept` and `Released`)"
at_risk = "The commits the WAL lost, which no restore brings back. The latest state is the damaged file; the state before it is restorable for seven days"
recovery = "Automatic. The notice and the kept restore point end seven days after the verdict, across restarts"
detected_by = "core::`a_boot_with_a_debt_reports_pages_from_commits_the_wal_lost`, core::`a_boot_with_a_debt_whose_file_kept_its_pages_comes_up_clean`, core::`a_recorded_verdict_stops_once_under_strict_responses`, core::`the_restore_point_is_kept_for_the_window_across_a_restart`, sidecar::`a_database_ahead_of_its_wal_is_a_notice_in_both_outputs`; plant::`debt-boot-skips-page-check`, plant::`ahead-verdict-not-journaled`, plant::`ahead-truncate-before-check`, plant::`ahead-check-counts-covered-pages`, plant::`ahead-restore-point-released-early`, plant::`ahead-window-restarts-at-boot`, plant::`ahead-notice-never-ends`"
notes = "The simulator reaches it (first seed 0x585, now pinned by a hand-written history with no bucket rollback, known-wrong cell `DatabaseAheadOfWal`); its world does not yet adopt the mixed state as damage, so the run fails on the verdict it does not expect, and the cell flips once the judge allows a restore at the kept restore point. A page above the newest staged size that no frame covers is not checked. Holding the read mark at the proven frame cannot prevent the mix (D104)"

[[row]]
table = "Boot"
id = "BOOT-34"
circumstance = "A boot owes BOOT-31's check, and the replica cannot give its state at its newest confirmed transaction because it is damaged (a gap a bucket rollback left, a file that does not verify), not because a call failed (`core/src/ahead.rs`, `docs/decisions.md` D106)"
response = "The check's restore plans once a tick. The first attempt that finds damage degrades the sync task at `RemoteCorrupt` and retries after the backoff; a failed call or a listing page that fails is a store fault, retried as such and never counted. The next attempt that finds damage gives the check up: the notice is journalled, the sync task is degraded at `DatabaseAheadOfWalUnchecked` through `database_ahead_of_wal`'s response (under `STRICT`: stop, once), and the cure runs as in RUN-3. No restore point is kept: the state it would keep is the one the replica cannot give"
signal = "`remote_corrupt`, then `database_ahead_of_wal_unchecked`, in `Health.degraded` while degraded; `Health.ahead_of_wal_unchecked`, `/healthz` `database_ahead_of_wal_unchecked` and `lsr_database_ahead_of_wal_unchecked` for seven days; the degraded event logged at error level, a boot inside the window and its end logged (`Event::AheadOfWal`, `UncheckedStands` and `UncheckedEnded`)"
at_risk = "A database file ahead of its WAL is replicated as a clean commit, marked only by the notice, which a lost journal forgets. A crash between giving up and the TRUNCATE makes the next boot check again"
recovery = "Automatic. The notice ends seven days after the check was given up, across restarts; the snapshot after the cure starts a chain the replica can restore"
detected_by = "core::`a_check_the_replica_cannot_answer_is_given_up_and_the_cure_runs`, core::`the_unchecked_notice_stands_for_the_window_across_a_restart`, core::`a_replica_missing_the_confirmed_state_is_unrestorable`, core::`a_failed_listing_is_the_store_s_fault_not_damage`, sidecar::`an_unchecked_wal_checkpoint_is_a_notice_in_both_outputs`, sim::`ahead_unchecked::a_gap_below_the_confirmed_state_does_not_hold_back_the_cure`"
notes = "Before D106 the check retried a damaged replica for ever, holding back the TRUNCATE while the WAL grew (seed 0x2dc719, found when the D103 cell was drawn). The simulator expects `RemoteCorrupt` and `DatabaseAheadOfWalUnchecked` after a bucket rollback that removed files, since the engine may upload past the hole before it lists again"

[[row]]
table = "Boot"
id = "BOOT-33"
circumstance = "The engine confirms an upload, boots, or sees its replica roll back, with a destination named (`ActorConfig::destination`, from the replica's endpoint, bucket and prefix or directory; `core/src/actor/floor.rs`, `docs/decisions.md` D107)"
response = "Every confirmed upload raises the confirmed floor to its transaction, anchored on the uploaded file's length, raw-byte digest and file checksum when this process holds its witness, and the end of the tick journals it. A boot reads it back for the same destination only and keeps it when its listing ends lower. A rollback seen while running withdraws the anchor and keeps the bound. Another destination's floor stays in the record, unadopted, until this destination has one; with no destination named the record's floor passes through"
signal = "None of its own: the floor is in the journal and `Actor::floor`. A floor the journal cannot record keeps `JournalUnwritable` up"
at_risk = "A boot does not yet act on the floor it reads: taking no id at or below it is the boot rule of issue #171, item 4, built on this. A journal lost, unwritable or unread forgets it, as every journalled fact. A changed region changes an S3 replica's default endpoint, so that boot adopts no floor"
recovery = "Automatic"
detected_by = "core::`a_confirmed_upload_raises_the_floor_anchored_on_the_bytes_it_put`, core::`the_floor_is_read_back_and_a_rollback_before_the_boot_does_not_lower_it`, core::`another_destination_s_floor_is_kept_in_the_record_but_not_adopted`, core::`no_destination_keeps_no_floor_and_leaves_the_record_s`, core::`a_rollback_seen_while_running_withdraws_the_anchor_and_keeps_the_bound`, core::`an_unwritable_journal_reports_a_floor_it_does_not_hold`, core::`a_rebuild_keeps_the_floor_a_lagging_journal_does_not_hold`, config::`each_replica_plan_names_its_destination_for_the_journal`"
notes = "The floor was in the journal's format, model and writer rules from the start; until this row the engine passed a recorded one through and wrote none"

