notes = "The plant covers the stalled cursor only, through the core tests that kill it. The conflicting-duplicate half is **code only**"

[[row]]
table = "Boot"
id = "BOOT-18"
circumstance = "The boot's listing lags the bucket and hides the engine's own newest uploads, a snapshot, or a level 1 to 8 file"
response = "**Read past.** After the listing the engine reads the keys a reader can name for each transaction past the listed newest (its level-0 file, a level-0 file from the first transaction or from where the listed level 0 ends, the level 1 to 8 files from each start the listing implies, the snapshot ending at it; `core/src/probe.rs` `walk` and `Starts`), through the newest staged transaction and then until 3 transactions in a row are missing; with nothing staged, to its cap of 64 transactions (D63). Past the first 4 transactions only the level-0 and snapshot keys are read. A level's starts are the transaction after its newest listed file and the first file of the level below above it, where any compaction into it begins. What the reads find is the replica's newest. Level-0 uploads are conditional, so a key the reads missed is refused by the bucket"
signal = "none"
at_risk = "None for the engine's own hidden files, or for a hidden merged file whose level-0 inputs an operator removed while that level's previous file is listed. The case where the lag hides that previous file too is BOOT-32"
recovery = "None needed"
detected_by = "core::`a_listing_that_hides_the_newest_uploads_is_corrected_by_reads`, core::`a_snapshot_a_listing_hides_is_found_by_a_read`, core::`a_hidden_level_one_file_past_the_listing_is_found_by_its_level_key`, sim::`a_stale_boot_listing_does_not_stop_the_engine_on_its_own_files`, sim::`an_id_a_lagging_listing_hides_under_a_merged_file_is_not_reused_seed_0xf4721`, core::`with_nothing_staged_the_probe_walks_past_a_wide_hole`, sim::`a_boot_with_staging_wiped_walks_past_a_wide_hole_seed_0x95a`; plant::`listing-trusted-without-probe`, plant::`boot-trusts-a-stale-listing`, plant::`probe-skips-higher-levels`, plant::`probe-skips-higher-levels-sim`, plant::`boot-walk-stops-at-the-gap-with-staging-empty`, plant::`boot-walk-stops-at-the-gap-with-staging-empty-sim`"
survived_by = "sim::`a_stale_boot_listing_does_not_stop_the_engine_on_its_own_files`, sim::`an_id_a_lagging_listing_hides_under_a_merged_file_is_not_reused_seed_0xf4721`"
notes = "Seeds 0x517 and 0x4dc (an operator removes another writer's level-0 file after it was merged into level 1, and the lag hides the level-1 file) failed before the level keys were read; their recorded histories stopped reaching the defect on later trees, as 0x4c5's and 0x4f4's did, and swarm seed 0xf4721's recorded history (the same case: the engine reused id 2 under a hidden level-1 2-2) is the one its plant now fails. The planner's property test checks that the probe names every compaction it plans. A probe gap wider than 3 below a hidden upload, with staging wiped, ends in a false `OtherWriter` stop"

[[row]]
table = "Boot"
id = "BOOT-19"
circumstance = "The bucket was rolled back to an earlier state while the engine was down"
response = "**Trusted**: the engine keeps no record of what it once confirmed, so the short bucket is the bucket. A freed transaction id is put again with other bytes"
signal = "none"
at_risk = "One transaction id with two contents over time. If the first was merged upward before the rollback took it, a restore could combine both. Counts against G1. No wrong restore has been shown"
recovery = "None"
no_test = "known wrong"
notes = "Expected-fail test on main: sim `a_rolled_back_bucket_never_gets_a_transaction_id_reused_across_a_restart_seed_0x484` (`#[ignore]`). The three \"latest went back\" seeds that earlier drafts cited pass on main since b812e0f and are pinned as passing tests in `sim/tests/sim/restored_staging.rs`"
in_review = "None open. Needs a durable record of what was confirmed"

[[row]]
table = "Boot"
id = "BOOT-20"
circumstance = "The process is killed and restarted in a loop, every few seconds"
response = "Each boot decides alone. Any boot that cannot prove continuity takes a full snapshot. Nothing limits how often"
signal = "The cause per boot. No rate signal"
at_risk = "Storage and upload volume, not data. Observed on the LazyFS rig while #97 was written: the replica and staging grew to many times the database's size and filled the disk, and maintenance never ran because no process lived long enough for uploads to go idle. The figures are not in the repository, so none is quoted"
recovery = "An operator stops the loop and clears the files"
no_test = "known wrong (no failing test)"
notes = "**known wrong**, measured, no assertion"
in_review = "#97 fixes scratch files and maintenance starvation. The snapshot per boot is unchanged"

[[row]]
table = "Boot"
id = "BOOT-21"
circumstance = "The process restarts while a task was retrying, degraded or stopped"
response = "The new process knows none of it: retry counts, waits, degraded states and a stop all start empty. A failed WAL fsync is the exception: the engine journal holds it (RUN-3) A stop for another writer still holds across the restart because the boot refuses the other writer's files again: above staging (BOOT-22) or under the key staging holds its own copy of (BOOT-13). A takeover record (`<meta>/lsr-takeover`, `core/src/takeover.rs`), written by `lsr take-over`, by every restore and by the engine before it deletes staged files (BOOT-30), is read at every start"
signal = "The new boot's own signals; `other_writer` again while the other writer's files stand"
at_risk = "A supervisor that restarts on `/healthz` 503 removes every backoff"
recovery = "n/a"
