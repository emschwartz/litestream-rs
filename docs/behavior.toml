[[row]]
table = "Upload"
id = "UP-4"
circumstance = "The store refuses access (`classify.rs`; the codes and their kinds are tabled in its module doc): credentials not accepted (401, `InvalidAccessKeyId`, `SignatureDoesNotMatch`, `ExpiredToken`, `InvalidToken`, `TokenRefreshRequired`); a policy refuses the request (`AccessDenied`, `AllAccessDisabled`, any other 403, a batch delete refusing one key); the host clock is too far from the store's (`RequestTimeTooSkewed`); the bucket does not exist (`NoSuchBucket`); the TLS handshake or certificate check fails"
response = "degraded, `StoreDenied(Credentials \\| Permission \\| ClockSkew \\| BucketMissing \\| Tls)`, each with its own response"
signal = "`credentials`, `permission_denied`, `clock_skew`, `bucket_missing`, `tls`"
at_risk = "Lag without bound; staging grows"
recovery = "An operator fixes what the name says: the keys, the policy, the host clock, the bucket name, or the TLS trust"
detected_by = "sim::`creds_revoked_mid_run`, sim::`permission_revoked_mid_run`, sim::`clock_skewed_against_the_store_mid_run`, sim::`bucket_deleted_mid_run`, sim::`tls_fails_mid_run`, store-s3::`classify_denials_by_what_to_fix`, store-s3::`a_delete_refused_for_one_key_is_a_permission_denial`, sidecar::`each_access_refusal_has_its_own_name`, sim::`a_refused_upload_is_reported_as_what_the_operator_must_fix`; plant::`denial-classes`, plant::`delete-denial-transient`"
survived_by = "sim::`revoked_credentials_degrade_and_restores_meanwhile_are_refused_or_exact`"
recovered_by = "sim::`creds_revoked_mid_run`, sim::`permission_revoked_mid_run`, sim::`clock_skewed_against_the_store_mid_run`, sim::`bucket_deleted_mid_run`, sim::`tls_fails_mid_run`"
notes = "Each scenario injects one refusal of its kind on one upload, then recovers. The hold in `revoked_credentials_degrade_and_restores_meanwhile_are_refused_or_exact` refuses every call on the replica for 6 ticks while the app commits: the engine reports `credentials` (on the sync task when the boot meets it), the raw replica restores committed states in the middle and at the end, and restores through the revoked store are refused: S, for credentials only. A lasting refusal of the other kinds, and staging growth, are **untested**. The chain from an HTTP response to the health name is shown in pieces: the classifier tests, the scenarios (cause), the sidecar test (name). With the replica on the S3 store, `a_refused_upload_is_reported_as_what_the_operator_must_fix` answers one upload with a KMS, expired-token, clock-skew and missing-bucket refusal in turn and the simulator's refusal judge (`docs/decisions/D169.md`, its own table of the codes) requires each kind reported; drawn histories refuse any request, or one key of a batch delete, the same way"

