# The behaviour table's rows (docs/BEHAVIOR.md section 3), one `[[row]]` per row: the source the
# document's tables are rendered from (docs/behavior/template.md, `just behavior-doc`). Each key holds
# its column's cell verbatim; the evidence keys are checked (crates/compat/tests/compat/behavior.rs).
# Column to key: docs/BEHAVIOR.md section 7.2.
# `mark` is not a column: "site" when lsr-core has a `mark!` on the branch that detects the row's
# circumstance (crates/core/src/marks.rs), else "none: <reason>"; "not yet placed" in a reason
# means a site is possible and unwritten. The nightly soak fails on a site no seed reaches
# (crates/sim/src/marks.rs).

