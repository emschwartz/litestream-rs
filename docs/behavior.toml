[[row]]
table = "Upload"
id = "UP-7"
circumstance = "The store acknowledged a commit with another size than was written: a short write it took as whole"
response = "Never taken as published (`CommitSizeMismatch`), for every engine commit: a level-0 upload, a compaction output, a staged file (`publish.rs`, and `Retrying` in the command line). After a create-only write the object is deleted before anything is reported (`removed` says whether the delete took). After a replace nothing is deleted (`removed: false`): the key may have held an acknowledged object, and a delete would end the replica a transaction early with no error, where the short object makes a restore stop with a typed error until it is written again. An upload then retries, `UploadAmbiguous`, as UP-6, and its next write replaces the short object; a compaction round fails with the same fault, maintenance removes the output under its own reason while the inputs still cover the range, and retries"
