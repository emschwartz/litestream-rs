table = "Config and startup"
id = "CFG-23"
circumstance = "What a `litestream.yml` says (`config/src/{yaml,walk,value,build}.rs`): every key litestream-rs implements, read as yaml.v2 reads it into Go's type, after environment expansion, with Go's defaults, global replica settings copied down, database snapshot settings promoted, and Go's validation"
response = "continue with the values Go would run with, or refuse what Go refuses"
signal = "none, or exit 2"
at_risk = "None"
recovery = "n/a"
detected_by = "compat::`go_and_rust_parse_the_same_config`"
notes = "A differential against Go's own `ReadConfig` and `NewDBFromConfig` (the dumper), 2,048 generated files per run; 10,000 passed once, 6,221 of them compared value by value, the rest refused by both, by a recorded departure, or at different stages by both. The generator writes durations bare, fractional, compound, negative and malformed; YAML 1.1 booleans; octal, hex, underscored and signed integers; SI and IEC sizes; quoted and unquoted strings; `~` and empty values; `$VAR` and `${VAR}` set and unset; anchors with merge keys; flow mappings; document markers; the deprecated `replicas` list; the `litestream-rs` section. The run fails if fewer than half its cases compared values. Values Go reads as the same as another are compared as one: a zero `truncate-page-n`, `concurrency` or `part-size` is Go's default; a null pointer setting keeps the store's default. Not generated: more than one document, explicit tags, scalar aliases"

