[[row]]
table = "Config and startup"
id = "CFG-26"
circumstance = "A value no start could use, which Go accepts and then fails on at run time: a signing region with whitespace, `/` or a control character (Go's requests all fail); a `part-size` under 5 MiB (Go's uploader refuses every upload); `monitor-interval` zero or less (Go never polls); a duration below a millisecond or negative where the engine counts whole milliseconds (often a bare `10`, which yaml.v2 reads as 10 ns)"
