[[row]]
table = "Restore"
id = "REST-13"
circumstance = "`restore`'s command line (`cli/src/args/restore.rs`), read as Go's: Go's flag package rules and flags, one positional argument, a replica URL (`scheme://`, read as a config's `url:`) or a database path found among the config's `path` entries (`-config`, else `LITESTREAM_CONFIG`, else `/etc/litestream.yml`) without scanning `dir` entries or building the others, the output defaulting to that path; `lsr`'s `--replica`, `--output`, S3 flags, `--allow-earlier` and `--clear-journal-files` as further flags of the same table"
response = "continue or refuse as Go, with Go's messages, in Go's order: flag errors as the flag is read (`-txid`, `-parallelism`, `-follow-interval` included), then the source, `-integrity-check`, `-timestamp`, the config or URL, `-if-db-not-exists`, and a txid with a timestamp only when the plan or the restore is made. `-parallelism` warns and changes nothing, as Go. The output's missing parent directories are created (mode 0700) and removed again if the restore fails. A dry run plans whatever is at the output"
signal = "exit 0, or 1 on every failure, as Go (D47)"
at_risk = "None"
recovery = "n/a"
detected_by = "compat::`go_and_lsr_restore_the_same_command_lines`, cli::`a_database_path_restores_its_configured_replica_to_that_path`, cli::`a_replica_url_restores_to_the_output_it_names`, cli::`missing_parent_directories_are_created_and_removed_after_a_failure`, cli::`dry_run_plans_whatever_is_at_the_output`, cli::`a_url_restore_with_a_timestamp_refuses_an_empty_replica`, cli::`txid_as_go_reads_it`, cli::`two_targets_at_once`, cli::`a_database_path_restores_beside_a_dir_entry_that_holds_nothing`; plant::`dry-run-checks-the-output`, plant::`parents-left-after-failure`, plant::`url-timestamp-empty-replica-skipped`, plant::`restore-plans-whole-config`"
notes = "The compat test is a differential against the pinned `litestream restore` over 512 generated lines per run (2,560 passed in five runs), each side in a directory laid out the same way against one fixture replica, the output and database paths drawn absent, empty, not a database or beside a stale WAL. Exit codes, failure classes and every file afterwards must agree, databases by their restored pages; a tally fails the run unless restores (about 90 a run), plans, skips, help and each refusal class are reached. It found five differences, all fixed toward Go: the dry run's output check, the order of the txid-and-timestamp refusal, the URL-with-timestamp refusal of an empty replica, parent directories, and the exit codes. A sixth, found by the `ltx` differential: a `DB_PATH` is looked up among the config's `path` entries only, so a `dir` entry that holds nothing no longer stops the restore; the restore differential's config now carries one. Three departures are asserted, not compared (REST-2, REST-14, REST-15)"

