[[row]]
table = "Upload"
id = "UP-10"
circumstance = "A listing made while running shows the replica ahead of everything this engine staged (`upload.rs`, `actor.rs`)"
response = "**stop**, `OtherWriter` (default). No upload, compaction or delete follows. Files one of this engine's own running drops vouched for (BOOT-30: the replica may hold them unconfirmed) are not another writer's: until the next boot a listing judges the replica against them as well as what is staged, the uploader lists first after the drop so they are confirmed and the snapshot goes above them, and a divergence at such an id is the engine's own earlier upload, which stands. Nor are files at or below what this process confirmed: a listing after a rollback (UP-11) judges the replica against that mark too, so the file a boot took as its base is not taken for another writer's once the rollback took the files above it. Cost accepted (D51): after a rollback, a second writer that refills such an id with no staged copy to compare is taken as the replica's file"
signal = "`other_writer`; `/healthz` 503"
at_risk = "Everything committed after the stop is unreplicated until an operator acts. The steady state makes no listing, so the other writer is seen only at the next maintenance listing or after an ambiguous commit. A maintenance listing follows this engine's own upload by at most one compaction window (30 s by default) once uploads are idle; an engine with nothing to upload lists only when its next scheduled job is due. No bound on detection is asserted: **code only**"
recovery = "An operator removes the other writer, then restarts"
detected_by = "core::`maintenance_stops_on_a_file_past_its_position_only_when_a_read_finds_it`, core::`rule_2_running_behind_the_remote_stops`, sim::`second_writer_mid_run`, sim::`under_go_like_a_second_writer_stops_uploads_and_maintenance`, sim::`maintenance_stops_on_another_writer_seed_0x50c`, core::`vouch::a_listing_after_a_running_drop_takes_the_vouched_upload_as_its_own`, core::`vouch::a_snapshot_on_an_id_a_running_drop_vouched_for_gives_way_to_the_replicas_copy`, core::`vouch::maintenance_after_a_running_drop_waits_for_the_listing_that_confirms_its_upload`, core::`vouch::a_listing_after_a_rollback_takes_the_base_its_boot_confirmed_as_the_replicas`; oracle::`OtherWriterMissed`, plant::`maintenance-another-writer`"
recovered_by = "sim::`second_writer_mid_run`, sim::`under_go_like_a_second_writer_stops_uploads_and_maintenance`"
notes = "R only after the other writer's files were removed. No restore is judged with two writers' files in the bucket"
in_review = "#96"

[[row]]
table = "Upload"
id = "UP-11"
circumstance = "The replica lost files this process confirmed (a bucket rolled back, files deleted under the engine). Seen two ways: an uploader listing shows the replica's newest transaction below what was confirmed (`upload.rs`; the uploader lists only at boot and after an ambiguous commit), or a maintenance listing misses a file this process watched since its last one and a read finds it gone (`core/src/regression_watch.rs`: the last listing's anchor and every level-0 upload since, none of which the engine itself deletes before the next listing). A watched file the listing misses but a read finds is a lagging listing, and nothing is decided"
response = "degraded, `RemoteRegressed`: list again and continue from what the replica holds now. Transaction ids this process already acknowledged are never used again by this process, and a file at or below them is not another writer's (UP-10)"
signal = "`remote_regressed`"
at_risk = "The files that vanished. The engine does not re-upload them. Until the next snapshot, restores of the latest state refuse with `Gap`. Detection waits for the next maintenance listing, which follows the engine's own upload by at most one compaction window once uploads are idle; uploads above the hole go on until then"
recovery = "Automatic"
detected_by = "sim::`bucket_rolled_back`, sim::`bucket_rolled_back_unseen`, core::`a_relist_never_takes_an_acknowledged_transaction_again`, core::`a_rollback_while_running_is_seen_by_the_next_maintenance_listing`, core::`a_lagging_listing_is_not_a_regression`, core::`regression_watch::tests::missing_names_exactly_the_first_dropped_object`; plant::`relist-acknowledged-mark`, plant::`regression-unwatched`, plant::`regression-unwatched-sim`, plant::`regression-on-listing-alone`"
recovered_by = "sim::`bucket_rolled_back`, sim::`bucket_rolled_back_unseen`"
no_test = "a loss between a boot and its first maintenance listing that removes only what the boot listed: untested"
notes = "That window has no anchor; a loss while the engine is down is BOOT-19. The watch's anchor is the seam for the engine journal, which would let a boot run the same check"
in_review = "#96 adds a read-based mark (`gone`) for the same listings; the two meet in `actor/state.rs`"

