detected_by = "core::`rule_4_no_wal_file_is_wal_missing`, core::`rule_4_a_torn_header_is_wal_missing`, sim::`wal_deleted_while_down`, sim::`restored_with_no_wal`, cli::`a_restored_database_snapshots_with_no_write_and_no_retry`"
recovered_by = "sim::`wal_deleted_while_down`, sim::`restored_with_no_wal`"

