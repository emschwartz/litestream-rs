at_risk = "Lag without bound"
recovery = "Fix the clock"
detected_by = "store-s3::`classify_denials_by_what_to_fix`, sim::`clock_skewed_against_the_store_mid_run`"
recovered_by = "sim::`clock_skewed_against_the_store_mid_run`"
notes = "The scenario injects one refusal, then the step succeeds. A skew that lasts is **untested**"

[[row]]
table = "Circumstances the code does not distinguish"
id = "WORLD-16"
circumstance = "The database's or staging's filesystem is remounted read-only; EMFILE; EDQUOT"
