[[row]]
table = "Running"
id = "RUN-3"
mark = "site"
circumstance = "The engine's fsync of the WAL before staging fails (`WalSource::sync`, `sqlite/src/conn.rs`)"
response = "degraded, `WalSyncFailed` (sync task), from wherever it was met: a sync step or a checkpoint's seal (`Actor::fault`). Nothing more is staged from that WAL generation, since a later fsync that succeeds proves nothing about the pages the kernel called clean. The retry runs a TRUNCATE checkpoint in place of a sync (SQLite copies every committed page into the database file and syncs it, then empties the WAL), then a snapshot, cause `WalSyncFailed`. A busy TRUNCATE (readers) is the same fault again. Under `STRICT`: stop"
signal = "`wal_sync_failed` in `Health.degraded`, `/healthz` and `lsr_degraded`; then `wal_sync_failed` as the snapshot cause"
at_risk = "Commits after the failure are unreplicated until the TRUNCATE completes, without bound while readers block it. Pages the page cache lost before the TRUNCATE are lost to SQLite too (`actor/unproven.rs` lists the limits); a checkpoint that copied frames the failed sync covered before such a loss leaves the database file ahead of its WAL, which the next boot finds (BOOT-31). The engine journal holds the debt across a restart; a kill inside the failing tick, an unwritable journal or a deleted one still forgets it (D2, narrowed)"
recovery = "Automatic once the TRUNCATE completes, in this process or, through the journal, the next. Under `STRICT`: restart"
detected_by = "sqlite::`a_failed_wal_sync_stages_nothing_of_its_generation_and_snapshots_after_a_truncate`, core::`a_failed_wal_sync_stages_nothing_of_its_generation_and_ends_in_a_snapshot`, core::`a_busy_truncate_after_a_failed_wal_sync_stays_degraded_and_stages_nothing`, core::`a_wal_sync_failed_in_a_checkpoint_seal_is_never_retried_past`, core::`a_failed_wal_sync_stops_under_strict_responses`, core::`after_a_completed_truncate_staging_resumes_from_the_new_generation`, sim::`wal_fsync_fails`, sim::`wal_fsync_fails_then_restart`, sqlite::`a_restart_after_a_failed_wal_sync_ships_no_unproven_frame`, core::`a_failed_wal_sync_is_recorded_in_the_tick_that_met_it`, core::`a_restart_after_a_failed_wal_sync_still_owes_the_truncate`, core::`a_recorded_truncate_already_run_is_not_run_again`, core::`an_unwritable_journal_is_reported_and_the_debt_is_paid_from_memory`; oracle::`StagedNotDurable`, plant::`journal-debt-not-recorded`, plant::`journal-debt-not-restored`, plant::`wal-barrier`, plant::`wal-sync-error-as-success`, plant::`wal-trusted-after-failed-sync`"
recovered_by = "sqlite::`a_failed_wal_sync_stages_nothing_of_its_generation_and_snapshots_after_a_truncate`, sim::`wal_fsync_fails_then_snapshot`"
notes = "The sqlite test judges restores after the snapshot and again after a power cut; the sim scenario after a power loss. No restore is judged while the task is degraded, so no S. The simulator keeps the bytes a failed sync covered off its disk for good, and oracle `StagedNotDurable` fails any level-0 file staged from them. The restart half is closed by the engine journal (`docs/journal.md`): the debt is written at the end of the tick that met the failure and restored at boot"

