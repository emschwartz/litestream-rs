[[row]]
table = "Boot"
id = "BOOT-3"
circumstance = "The newest staged file verifies; the WAL has the same salts; the frame before the file's end is a commit with the same page; the WAL holds the file's whole range with the same pages and commit size (rules 7 to 10, `recover.rs`)"
