[[row]]
table = "Boot"
id = "BOOT-18"
mark = "none: the code trusts a lagging listing; nothing detects the hidden upload"
circumstance = "The boot's listing lags the bucket and hides the engine's own newest uploads or a snapshot"
response = "**Read past.** After the listing the engine reads the keys a reader can name for each transaction past the listed newest (its level-0 file, a level-0 file from the first transaction, the snapshot ending at it; `core/src/probe.rs`), through the newest staged transaction and then until 3 transactions in a row are missing (at most 64). What the reads find is the replica's newest. Level-0 uploads are conditional, so a key the reads missed is refused by the bucket"
signal = "none"
at_risk = "None for the engine's own hidden files. Open: a level 1 to 8 file whose level-0 inputs someone else deleted (an operator removing another writer's merged file) has a start no read can name; a lag that hides it lets the next upload reuse the freed id. Violates G1 in that case (#99)"
recovery = "None needed; the open case: none"
detected_by = "core::`a_listing_that_hides_the_newest_uploads_is_corrected_by_reads`, core::`a_snapshot_a_listing_hides_is_found_by_a_read`, sim::`a_stale_boot_listing_does_not_stop_the_engine_on_its_own_files`; plant::`listing-trusted-without-probe`, plant::`boot-trusts-a-stale-listing`"
survived_by = "sim::`a_stale_boot_listing_does_not_stop_the_engine_on_its_own_files`"
no_test = "open case: known wrong"
notes = "The operator case fails in the swarm's lag seeds (0x4dc and 0x517 on the merged tree) and has no pinned test (#99). A probe gap wider than 3 below a hidden upload, with staging wiped, ends in a false `OtherWriter` stop"

