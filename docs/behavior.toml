[[row]]
table = "Running"
id = "RUN-3"
circumstance = "The engine's fsync of the WAL before staging fails (`WalSource::sync`, `sqlite/src/conn.rs`)"
response = "degraded, `WalSyncFailed` (sync task), from wherever it was met: a sync step or a checkpoint's seal (`Actor::fault`). Nothing more is staged from that WAL generation, since a later fsync that succeeds proves nothing about the pages the kernel called clean. The retry runs the verified cure in place of a sync (D108): a checked read of the WAL, a FULL checkpoint (SQLite copies every committed page into the database file and syncs it, and leaves the WAL), a check that it copied exactly the frames read, a read of every copied page back against its frame's digest, then a TRUNCATE that empties the WAL, then a snapshot, cause `WalSyncFailed`. A busy FULL or TRUNCATE (readers), or a commit between the read and the FULL, is the same fault again; a TRUNCATE retried after a proven FULL runs alone. Pages unlike their frames are RUN-30. Under `STRICT`: stop"
signal = "`wal_sync_failed` in `Health.degraded`, `/healthz` and `lsr_degraded`; then `wal_sync_failed` as the snapshot cause"
at_risk = "Commits after the failure are unreplicated until the TRUNCATE completes, without bound while readers block it. Pages the kernel evicted before the cure are found by its checked read of the WAL, and the engine runs no checkpoint over them (`wal_corrupt`, D108); pages evicted inside the FULL checkpoint are found by the read-back (RUN-30); pages lost where the engine cannot see it (a power loss, the application's own checkpoint) are lost to SQLite too (`actor/unproven.rs` lists the limits); a checkpoint that copied frames the failed sync covered before such a loss leaves the database file ahead of its WAL, which the next boot finds (BOOT-31). The engine journal holds the debt across a restart; a kill inside the failing tick, an unwritable journal or a deleted one still forgets it (D2, narrowed)"
recovery = "Automatic once the TRUNCATE completes, in this process or, through the journal, the next. Under `STRICT`: restart"
detected_by = "core::`a_cure_that_finds_an_evicted_frame_runs_no_checkpoint`, core::`a_commit_between_the_scan_and_the_full_checkpoint_proves_nothing`, core::`a_busy_full_checkpoint_is_the_failed_sync_again`, core::`after_a_busy_truncate_the_next_retry_truncates_again`, sqlite::`a_full_checkpoint_copies_every_frame_and_leaves_the_wal`, sqlite::`a_full_checkpoint_behind_an_older_snapshot_is_busy`, sim::`evicted_cure::an_eviction_before_the_cure_never_ships_the_disk_s_older_bytes`, sqlite::`a_failed_wal_sync_stages_nothing_of_its_generation_and_snapshots_after_a_truncate`, core::`a_failed_wal_sync_stages_nothing_of_its_generation_and_ends_in_a_snapshot`, core::`a_busy_truncate_after_a_failed_wal_sync_stays_degraded_and_stages_nothing`, core::`a_wal_sync_failed_in_a_checkpoint_seal_is_never_retried_past`, core::`a_failed_wal_sync_stops_under_strict_responses`, core::`after_a_completed_truncate_staging_resumes_from_the_new_generation`, sim::`wal_fsync_fails`, sim::`wal_fsync_fails_then_restart`, sqlite::`a_restart_after_a_failed_wal_sync_ships_no_unproven_frame`, core::`a_failed_wal_sync_is_recorded_in_the_tick_that_met_it`, core::`a_restart_after_a_failed_wal_sync_still_owes_the_truncate`, core::`a_recorded_truncate_already_run_is_not_run_again`, core::`an_unwritable_journal_is_reported_and_the_debt_is_paid_from_memory`; oracle::`StagedNotDurable`, plant::`journal-debt-not-recorded`, plant::`journal-debt-not-restored`, plant::`wal-barrier`, plant::`wal-sync-error-as-success`, plant::`wal-trusted-after-failed-sync`"
recovered_by = "sqlite::`a_failed_wal_sync_stages_nothing_of_its_generation_and_snapshots_after_a_truncate`, sim::`wal_fsync_fails_then_snapshot`"
notes = "The sqlite test judges restores after the snapshot and again after a power cut; the sim scenario after a power loss. No restore is judged while the task is degraded, so no S. The simulator keeps the bytes a failed sync covered off its disk for good, and oracle `StagedNotDurable` fails any level-0 file staged from them. The restart half is closed by the engine journal (`docs/journal.md`): the debt is written at the end of the tick that met the failure and restored at boot"

[[row]]
table = "Running"
id = "RUN-30"
circumstance = "The verified cure's read-back after its FULL checkpoint finds database-file pages unlike the WAL frames its checked read verified: the kernel evicted those frames after the read, and the checkpoint copied the disk's older bytes (`core/src/cure.rs`, `docs/decisions/D108.md`)"
response = "The verdict (the newest staged transaction as the restore point, the page count, the first page, the time) is held and journalled at the end of the tick, before any TRUNCATE; the sync task is degraded at `WalLostCommits` through `database_ahead_of_wal`'s response (under `STRICT`: stop). The next attempt runs the TRUNCATE alone, without reading the evicted frames again, then the snapshot; the file is replicated as the application serves it, and retention keeps the restore point for seven days, as BOOT-31's verdict"
signal = "`wal_lost_commits` in `Health.degraded` while degraded, then `Health.ahead_of_wal` (kind `WalLostCommits`), `/healthz` `wal_lost_commits` and `lsr_wal_lost_commits` until the window ends; the degraded event logged at error level, a boot inside the window and the window's end logged (`Event::AheadOfWal`, `Kept` and `Released`, with the kind)"
at_risk = "The commits whose pages the checkpoint replaced with older bytes, which no restore brings back. The latest state is the damaged file; the state before it is restorable for seven days. A restart between the verdict and the TRUNCATE forgets the proof, and the cure's next checked read finds the evicted frames (`wal_corrupt`) until the WAL's generation moves. With nothing ever staged there is no restore point to keep, and the verdict is raised without one"
recovery = "Automatic. The notice and the kept restore point end seven days after the verdict, across restarts"
detected_by = "core::`a_page_evicted_before_the_full_checkpoint_copies_it_is_lost_commits`, sidecar::`commits_a_checkpoint_lost_are_a_notice_of_their_own_in_both_outputs`, journal::`a_lost_commits_verdict_is_version_4_s_and_needs_a_verdict`"
notes = "The verdict cannot tell the cure's checkpoint from the application's over the same frames. The simulator expects `WalLostCommits` after an eviction, which may fire between the cure's read and its checkpoint; no seed is pinned"

