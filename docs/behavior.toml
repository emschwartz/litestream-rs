notes = "S: the 5% rate fault on uploads and listings is still active at the judged restore. A store fully down for one operation (list, read, upload or delete) for 2 to 11 ticks while the app commits: both judges restore the raw replica in the middle of the outage and at its end, and restores made through the down store fail with a store or listing error, never with another database (oracle `HeldRestore`). Campaign in `sim/tests/sim/survival.rs`: 2000 seeds of the default mix with holds, 0 failures. Network: the `network::` tests run the real replicator through Toxiproxy to MinIO (`just test-s3`) with a reset part way through a request or response body, a response that never arrives after the store acted, bodies sliced into small writes, and a slow link with latency; the history judge judges restores read straight from MinIO while the fault holds and after it clears. No planted bug is killed by them yet: the nightly ledger run starts no services"

