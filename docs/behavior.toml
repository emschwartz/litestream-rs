[[row]]
table = "Boot"
id = "BOOT-22"
circumstance = "Replica files above this database's local position (its newest staged file, taken before the boot drops anything) that the live WAL does not vouch for (BOOT-6) and no takeover record covers: another writer's files, appeared while this engine ran or while it was down, or the newer history a VM restore went back past"
response = "**Stop**, `OtherWriter`, before anything is written. The replicator emits `Event::Refused { through }`, and the sidecar logs \"replicate refused: the replica holds transactions up to {txid} that this database has no record of writing. Another replicator may be using this prefix. To replicate this database over them: `lsr take-over <db>`. To get them instead: `lsr restore`.\" Every later start stops again until one of: the files are removed; `lsr take-over <db>` records a takeover through the replica's newest transaction (snapshot above it, BOOT-6); `lsr restore` (it writes the takeover record itself). A file put above a takeover is refused again"
signal = "`other_writer`; the refusal log line"
at_risk = "None: nothing is written over or above the files"
recovery = "Operator"
detected_by = "core::`second_writer::a_restart_keeps_the_stop_for_another_writer`, core::`a_restart_after_an_other_writer_stop_stops_again`, core::`second_writer::a_restart_replicates_once_the_other_writers_files_are_gone`, core::`second_writer::continuing_past_another_writer_boots_above_its_files`, core::`vouch::a_foreign_file_put_while_the_engine_was_down_stops_the_boot`, core::`vouch::a_takeover_does_not_cover_a_foreign_file_above_it`, core::`vouch::continuing_past_another_writer_skips_the_gate`, sim::`second_writer_survives_restart`, sim::`foreign_file_while_down_stops`, sim::`survival::a_boot_never_builds_on_files_nothing_local_vouches_for_seed_0xb44`, replica::`second_writer::a_stop_for_another_writer_survives_a_restart`, replica::`second_writer::a_refused_boot_names_the_tip_and_a_take_over_clears_it`, sidecar::`logging::tests::a_refusal_logs_the_approved_text`, cli::`take_over_records_the_replicas_newest_transaction`; plant::`boot-gate-refuses-nothing`, plant::`boot-gate-refuses-nothing-sim`"
recovered_by = "sim::`second_writer_survives_restart`, sim::`foreign_file_while_down_stops`"
notes = "R after the operator removed the files, or took over. Ids alone cannot tell another writer's file from this engine's own lost one, so a doubt keeps the stop. The engine's own deletes of staged files keep a takeover record first (BOOT-30), so a refusal with no other writer comes only from an operator's action (a meta directory deleted after a WAL restart whose database is no longer the replica's state, a VM put back): the swarm's judge fails any other. A brand-new meta directory over a database equal to the replica's state is not refused (BOOT-6, D170); one that differs by a page, or by commits checkpointed but never uploaded, still is. Go has no such refusal: `ContinueAndInterleaveHistories` keeps Go's behaviour (snapshot above them)"

