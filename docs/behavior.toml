response = "The next use of the writer (the bump, or the next barrier or write lock) rolls the leftover transaction back first, and fails if that rollback fails. A bump while a lock is outstanding is refused, `Io(InvalidInput)`. Before, the bump ran inside the open transaction and the next release undid it unseen"
