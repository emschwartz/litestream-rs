[[row]]
table = "Circumstances the code does not distinguish"
id = "WORLD-1"
circumstance = "Two processes replicate one database through one staging directory (an overlapping rolling deploy; `lsr replicate` run by hand beside the daemon; two databases configured with one `meta_dir`)"
response = "**refuse** at start: `Replicator::start` takes an exclusive `flock` on `<meta>/lsr-lock` for the thread's life, and a second engine in this or another process on the host gets `MetaLocked` (CFG-36). The lock is on a file of its own, never replaced, so SQLite closing other descriptors cannot drop it. It excludes on local filesystems (ext4, XFS, Btrfs, ZFS, tmpfs; APFS, HFS+). Not covered: NFS, SMB and FUSE mounts, where a lock may be emulated or local to one client, and a Go process, which takes no lock; there the old outcome stands (both stage `confirmed + 1` under one key, and the other-writer check compares the replica with the shared staging, so it probably cannot fire)"
signal = "error"
at_risk = "Outside the lock's reach: one key written twice with possibly different page sets. Outcome for G1: **unknown**"
recovery = "Operator: stop the other engine, or give the database a meta directory of its own"
detected_by = "replica::`second_writer::a_second_engine_on_one_meta_directory_is_refused`, replica::`second_writer::a_second_process_on_one_meta_directory_is_refused`; plant::`meta-dir-unlocked`"
no_test = "outside the lock's reach: unknown"
notes = "The lock's reach is by reading the platforms' `flock` semantics; only Linux local disk and tmpfs are exercised"
in_review = "#96 would make the second PUT of a level-0 key fail outside the lock's reach"

[[row]]
table = "Circumstances the code does not distinguish"
id = "WORLD-2"
circumstance = "The process is paused while it holds the write barrier (CKPT-1), the write lock (CKPT-4) or only its read transaction"
response = "The barrier is an open write transaction. While paused, every application writer blocks and then gets `SQLITE_BUSY` at its `busy_timeout`; under the read transaction alone the WAL cannot be recycled and grows. On resume the wall clock has jumped forward (G3), every in-flight store request has passed its 60 s deadline (UP-2), and a multipart upload may have expired"
signal = "None while paused: the process cannot report. `reported_at` in `Health` goes stale; `lsr_health_report_age_seconds` shows it only if something else scrapes"
at_risk = "Application availability for the length of the pause. No replica damage expected. Guess"
recovery = "Automatic on resume. Guess"
no_test = "unknown"
notes = "None"

[[row]]
table = "Circumstances the code does not distinguish"
id = "WORLD-3"
circumstance = "Database, WAL and staging are put back together from an older VM or volume snapshot; the bucket is not"
response = "BOOT-22: the replica holds newer files the WAL cannot vouch for and no takeover record covers, so the boot stops, `OtherWriter`, and writes nothing. `lsr take-over <db>` then lets the next start snapshot the old state above the replica's newest transaction (BOOT-6); `lsr restore` gets the newer state instead"
signal = "`other_writer`, the refusal log line; after a take-over, `behind_remote`"
at_risk = "None until the operator chooses. After a take-over the latest state goes back to the snapshot's state (G2 exception, asked for). The newer history stays in the bucket until retention removes it, restorable by id"
recovery = "Operator"
detected_by = "sim::`vm_restore_stops_until_a_take_over`, core::`vouch::a_vm_restore_stops_until_a_takeover_covers_the_replica`; plant::`boot-gate-takeover-ignored`"
recovered_by = "sim::`vm_restore_stops_until_a_take_over`"
notes = "The scenario saves the meta directory, commits on, puts the meta directory back, truncates the WAL and commits again: the database and WAL are the simulator's, so they are not put back byte for byte"

[[row]]
table = "Circumstances the code does not distinguish"
id = "WORLD-4"
circumstance = "A restore lists the replica while the listing lags, or while files change under it"
response = "`restore` lists, plans, and before applying a `Latest` or `AsOf` chain reads one byte of each key a reader can name for each transaction past the listing (its level-0 file, a level-0 file from the first transaction or from where the listed level 0 ends, the level 1 to 8 files from the starts the listing implies, the snapshot ending at it), walking on from the next transaction until a key is found or more than 3 transactions in a row are missing, at most 64: the same walk the engine's uploader makes past its listings (`core/src/probe.rs` `walk`); an empty listing is walked for every target from the first transaction. A key found sends the restore back to list, at most three times, then `RestoreError::ListingBehind` (exit 3). The dry run reads the same keys. A file that vanishes is replanned (REST-4). A level-0 key overwritten mid-read (BOOT-16, BOOT-18) is read as whatever bytes arrive; a mixed read fails decode"
signal = "exit 3, `ListingBehind`"
at_risk = "A lag that hides files past a hole in the replica wider than the walk's gap, right after the listing's end: WORLD-42. A replica whose first transaction's file was retained away still looks empty to a listing that hides everything"
recovery = "Run again"
detected_by = "core::`a_newest_file_the_listing_hides_fails_the_restore_and_publishes_nothing`, core::`a_hidden_snapshot_past_the_listing_fails_an_as_of_restore`, core::`a_listing_that_shows_nothing_over_a_first_file_is_not_an_empty_replica`, core::`a_hole_right_after_a_lagging_listing_does_not_hide_the_files_past_it`, core::`a_hidden_level_zero_file_of_several_transactions_is_found_from_where_level_zero_ends`, cli::`a_dry_run_over_a_lagging_listing_fails_like_the_restore`, cli::`if_replica_exists_over_a_listing_that_shows_nothing_skips_nothing`; plant::`restore-trusts-listing`, plant::`empty-listing-is-empty-replica`, plant::`dry-run-trusts-listing`, plant::`restore-reads-one-transaction-past`"
survived_by = "sim::`a_restore_through_a_lagging_listing_is_the_replica_s_answer_or_an_error`"
notes = "Was **known wrong** in effect: the simulator's lagging-listing hold showed a restore of `Latest` publishing an older database with success on its first written history, and `--if-replica-exists` skipping a restore with success over a listing that showed nothing. Both fixed on this branch. The hold restores through a listing frozen when it began, held to the raw replica's answer or an explained error, and an as-of answer that differs from the raw one to the as-of bound (G3; D62); the hole case is accepted and counted (`hold.LaggingListing.past_hole`)"

[[row]]
table = "Circumstances the code does not distinguish"
id = "WORLD-5"
circumstance = "Failover: a new host restores and starts while the old host is still running"
response = "On main: both hosts put unconditional level-0 files (UP-14). Hosts that advance in step never see the replica ahead of themselves, so neither stops and each replaces the other's files id after id. With #96 the second put of each id is refused; the refused host's relist finds the other's verifying file at its next id while its staged copy is its own, and stops with `OtherWriter` (UP-17), keeping the stop across restarts (BOOT-22). The other host goes on"
signal = "`other_writer` on one side"
at_risk = "On main: one transaction id holds two databases' contents, without bound while both run; a restore can combine files from both. Violates G1. With #96 and UP-17: none of this engine's files is replaced, and the stopped host's commits after the stop are unreplicated"
recovery = "Operator: fence the old host before starting the new one"
no_test = "known wrong"
notes = "Expected-fail test on main: core::`failover_with_the_old_host_alive_never_publishes_one_id_twice` (`#[ignore]` until #96). Without UP-17, on main merged with #96, no id is published twice but neither host stops: each snapshots above the other's file and the replica's history alternates between the two databases"
in_review = "#96"

