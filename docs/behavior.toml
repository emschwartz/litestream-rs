[[row]]
table = "The checkers themselves"
id = "CHK-8"
circumstance = "An error the engine's SQLite seam or one of its stores can return, from some call, that no simulated history ever draws"
response = "The simulator's error domain (`sim/src/domain.rs`) lists every SQLite-side operation against every source error, and every store operation on both stores against every store error and denial kind, in matches with no wildcard: each cell is drawn, a world fault, impossible with a reason checked against lsr-sqlite, store-fs and store-s3, unmodelled, or known wrong. A new operation or error variant breaks the build there"
signal = "None (a checker)"
at_risk = "None (a checker)"
recovery = "None"
detected_by = "sim::`domain::tests::every_cell_is_drawn_or_says_why_not`, sim::`domain::tests::the_source_draw_reaches_every_drawable_cell_and_no_other`, sim::`domain::tests::the_store_draw_reaches_every_drawable_class_and_no_other`, sim::`known_wrong::a_restart_after_a_failed_wal_sync_owes_the_truncate_seed_0x21`, sim::`known_wrong::a_checkpoint_of_unproven_frames_then_a_power_loss_leaves_a_database_ahead_of_its_wal`, sim::`known_wrong::compaction_takes_a_staging_denial_as_staging_seed_0x68f`"
notes = "Before, histories drew two store errors and two SQLite errors on nine of twelve operations. The whole domain (22 source cells, 40 store cells, drawn last in the swarm mix) found D2 unaided in 85 of 3000 mixed seeds (first at seed 18) and a new defect, compaction classifying staging errors as the replica's (1 seed). D2 was a known-wrong cell until the engine journal fixed it (seed 0xf now must pass). The same cell stays known-wrong for what a failed sync still costs: a checkpoint copies unproven frames into the database file and a power loss leaves a file no commit made (detection at boot is the journal's next step), 1 of 3000 mixed seeds once D2 was fixed (seed 0x585), left out of the per-push seeds and counted as known in the nightly; the compaction cell was too until #145 fixed it, and its seed now must pass. Three cells are unmodelled, gaps in the simulator listed in section 6 (C9): an unlinked WAL. A checkpoint whose read-transaction retake is lost is drawn: the simulated checkpointer ends and retakes the read transaction around a failed checkpoint as lsr-sqlite does. WAL damage while a failed sync's writeback is lost is skipped and counted (`wal.damage_skipped.writeback_lost`)"

[[row]]
table = "The checkers themselves"
id = "CHK-9"
circumstance = "A lasting fault overlaps a crash, a power loss, a shutdown or another fault, or lasts long enough to stall; every store operation is down at once; another writer's file or a regrown WAL stands while the replica is judged"
response = "Under the overlap draw (drawn last in the swarm mix), a hold lasts up to 200 ticks and each of its steps is drawn: a commit, a tick, a one-shot store fault from the error domain, and, where known defects are counted, a process crash, a power loss or a shutdown with the fault still in place. The holds every store operation down at once, another writer's file, and the WAL regrowths are drawn too, and judged while they hold"
signal = "None (a checker)"
at_risk = "None (a checker)"
recovery = "None"
detected_by = "sim::`survival::a_store_down_for_every_operation_at_once_leaves_restorable_files`, sim::`survival::a_regrown_wal_leaves_the_replica_restorable_while_it_lasts`, sim::`survival::a_second_writer_s_file_leaves_the_replica_restorable_while_it_stands`, sim::`known_wrong::a_halt_across_restarts_still_goes_unreported_seed_0xe9`"
notes = "Before, a hold ran at most 11 ticks of commits and ticks, with no restart or second fault inside, and never held every store operation, a second writer or a regrown WAL. The overlap draw found D9 unaided (46 of 3000 mixed seeds with known defects counted, first at seed 233); a restart inside a hold reaches it, so only known-wrong runs draw one. It also found that the oracle mapped a standing second writer's id to an older put (fixed), that the stall check judged tasks a drain never runs (fixed), that the read budget did not count a degraded task's retries (fixed), that the retry-wait check measured from the wall clock while the engine's time slews after a step back (fixed), and passed on restores through a long stale listing (0x7f8, 0x12e) and an acknowledged level-0 object deleted after its key was put again (0xb6f, the reused-id class) to their owners"

[[row]]
table = "The checkers themselves"
id = "CHK-10"
circumstance = "An obligation a fault leaves the engine owing is held only in memory, so a restart right after the fault forgets it"
response = "Under the kill-after-fault law (drawn last in the swarm mix, half of it), the process dies right after the first tick in which an injected store fault or SQLite-side failure fires after a fault operation, once per operation. The obligation ledger (`lsr_core::obligations`) classifies every field of the engine's state, the SQLite connection's and the replicator thread's as derived, journalled, ephemeral or owed, and a source guard holds it to the structs; every fault is classified as reported again or reported once, and one reported once must leave a journalled obligation"
signal = "None (a checker)"
at_risk = "None (a checker)"
recovery = "None"
detected_by = "sim::`kill_after_fault::half_the_swarm_draws_the_law_and_the_default_mix_never`, sim::`kill_after_fault::a_kill_right_after_a_failed_wal_sync_still_owes_the_truncate_seed_0x116`, core::`actor::tests::ledger::every_field_of_the_actor_s_state_is_classified`, core::`actor::tests::ledger::every_journalled_field_is_read_at_boot_and_written_at_the_end_of_a_tick`, core::`actor::tests::ledger::a_fault_reported_once_leaves_a_journalled_obligation`; plant::`journal-debt-not-recorded-sim`"
notes = "On 2000 swarm seeds with the error domain and its known-wrong cells drawn, the debt plant failed 197 runs with the law and 170 without it, and none without the plant. The law also showed the second-writer judge charging a stop to a process it had just killed (fixed: a crash ends the watch, as a boot does), and a lost acknowledged transaction on seed 0x1dc, under triage. The ahead-of-WAL verdict's plant needs the simulator's adoption of the mixed state (D103) before the law can be its proof"
