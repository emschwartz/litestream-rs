detected_by = "sim::`a_short_outage_never_trips`, sim::`throttling_inside_the_bound_never_trips`, sim::`a_store_down_at_boot_does_not_trip`, sim::`a_refusal_after_the_first_listing_inside_the_bound_never_trips`, sim::`clock_steps_never_trip`, sim::`restarts_never_trip`, core::`a_heal_inside_the_backoff_is_found_by_the_probe_and_never_trips`, core::`a_failure_before_the_bound_never_trips`, core::`a_maintenance_fault_never_trips`, core::`a_timeout_at_boot_is_no_refusal`, oracle::`FalseTrip`, plant::`failstop-trip-on-first-failure`, plant::`failstop-trip-on-degraded`, plant::`failstop-boot-timeout-holds`, plant::`failstop-holds-on-an-unreachable-store`"
