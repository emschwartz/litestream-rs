notes = "Each scenario injects one refusal of its kind on one upload, then recovers. The hold in `revoked_credentials_degrade_and_restores_meanwhile_are_refused_or_exact` refuses every call on the replica for 6 ticks while the app commits: the engine reports `credentials` (on the sync task when the boot meets it), the raw replica restores committed states in the middle and at the end, and restores through the revoked store are refused: S, for credentials only. A lasting refusal of the other kinds, and staging growth, are **untested**. The chain from an HTTP response to the health name is shown in pieces: the classifier tests, the scenarios (cause), the sidecar test (name)"

