[[row]]
table = "Boot"
id = "BOOT-30"
circumstance = "The engine is about to delete staged files the replica may hold: a staged copy that turned unreadable (BOOT-5), a divergence (BOOT-13), a pending file the WAL no longer vouches for (BOOT-11), at boot or while running"
response = "It asks the driver for a takeover record through what staging vouched for (`Actor::takeover_wanted`, `Event::TakeoverWanted`) and deletes nothing until the driver hands it back. At boot: the newest staged transaction, capped at the replica's newest level-0 key, listed or found by a read past a listing that lags (a key judged torn counts). While running: the newest staged transaction, capped by a key the replica is known to end at and by the newest of the confirmed transaction and the newest level-0 put this engine sent (`Engine::attempted`): past both, nothing of this engine's can be on the replica, since a boot's listing showed what earlier processes put, so a record that reached further would let another writer's file at such an id pass the next boot. A record is spent when the engine publishes a transaction it covers after its own evidence that the replica held less than the record covers (a listing below it, including the relist after `RemoteRegressed`; D172): the engine stops holding it and the replicator deletes `<meta>/lsr-takeover` (CFG-46), so after a rollback it cannot vouch for another writer's file at its ids. A record already held that covers it is enough. The replicator writes `<meta>/lsr-takeover` by scratch, fsync, rename and directory fsync, then hands it back"
signal = "`TakeoverWanted`; `TakeoverNotRecorded` when the write fails"
at_risk = "None"
recovery = "Automatic"
detected_by = "core::`vouch::a_crash_between_the_engines_own_drop_and_its_snapshot_is_not_a_refusal`, core::`vouch::publishing_a_covered_transaction_spends_the_takeover_record`, core::`vouch::a_rollback_seen_while_running_arms_the_takeover_for_the_next_publish`, core::`vouch::a_takeover_before_a_running_drop_reaches_no_further_than_the_puts_it_sent`, core::`vouch::a_takeover_the_driver_cannot_write_keeps_the_staged_files_and_waits`, sim::`survival::an_unconfirmed_upload_dropped_from_staging_is_never_refused_seed_0xd`, sim::`survival::a_running_drop_records_past_an_unconfirmed_upload_seed_0x348`, sim::`survival::a_boot_drop_records_through_what_staging_vouched_for_seed_0x2e7`, core::`the_takeover_before_a_witness_drop_covers_a_tail_the_listing_hides`; plant::`takeover-before-drop-skipped`, plant::`running-drop-record-capped-at-confirmed`, plant::`boot-drop-record-capped-at-confirmed`, plant::`boot-drop-record-capped-at-listed`, plant::`takeover-ask-spins`"
recovered_by = "sim::`survival::an_unconfirmed_upload_dropped_from_staging_is_never_refused_seed_0xd`"
notes = "A write that fails hands nothing back: the next ask fails `LocalIo` and waits its backoff, and nothing is deleted unrecorded. Pending files above every replica key vouch for nothing there, so one put back from a backup never raises the record"


[[row]]
table = "Boot"
id = "BOOT-32"
circumstance = "A lagging listing hides a level 1 to 8 file whose level-0 inputs are gone (an operator removed another writer's file after maintenance merged it) **and** hides that level's previous file, so the listing implies no start for it"
response = "**Trusted.** No read can name the file: its start is the end of a file the listing does not show. The engine takes the replica as ending below it and uploads its next transactions into ids the hidden file holds"
signal = "none"
at_risk = "Each id of the hidden file past the listed newest can hold two contents, and a restore that combines the hidden file with the new level-0 files gives a state no commit made. Violates G1. Bound: two files of one level written after the listing's view (two compactions of one level inside the lag window) and level-0 inputs removed by someone other than this engine, since nothing this engine runs deletes the replica's newest level-0 file"
recovery = "None. The scheduled verify or a test restore may notice"
detected_by = "core::`a_listing_that_hides_two_level_one_files_hides_the_newer_ones_start`"
