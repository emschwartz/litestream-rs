[[row]]
table = "Running"
id = "RUN-14"
mark = "none: classified by the staging store; core maps it in a const fn"
circumstance = "The staging directory's disk is full, or a staging write fails"
response = "retry, `LocalDiskFull` for ENOSPC, EDQUOT or no free scratch name (`Fault::from_staging`), `LocalIo` for any other failed write; degraded `Stalled(LocalDiskFull)` or `Stalled(LocalIo)` from the 8th failure in a row. The position moves only when the staging commit returned success"
signal = "\"retrying\", then `local_disk_full` or `local_io` in `Health.degraded`"
at_risk = "Lag, without bound while the disk is full. The WAL keeps growing on what is often the same disk"
recovery = "An operator frees space"
detected_by = "sim::`disk_full_on_staging`, core::`a_full_staging_disk_is_disk_full`, core::`a_local_read_error_comparing_copies_is_a_staging_fault`, core::`a_local_read_error_while_compacting_is_a_staging_fault`; plant::`staging-enospc-local-io`, plant::`compact-local-read-as-remote`"
survived_by = "sim::`a_full_staging_disk_leaves_the_replica_restorable_while_it_lasts`"
recovered_by = "sim::`disk_full_on_staging`"
notes = "The scenario injects one `ScratchExhausted` on one staging upload, then recovers. No disk is filled; lasting ENOSPC and the WAL growth are **untested**. The stall is shown for `LocalDiskFull` on the upload task by core::`a_retried_fault_that_persists_ends_degraded_as_a_stall` (eight injected failures), not on the sync task. The hold in `a_full_staging_disk_leaves_the_replica_restorable_while_it_lasts` fails every staging upload with ENOSPC (a transient `StorageFull`, as the directory store reports it) for 6 ticks while the app commits, and the replica is judged in the middle and at the end: S. ENOSPC and EDQUOT are `LocalDiskFull` (core::`a_full_staging_disk_is_disk_full`); they were `LocalIo`. Level-1 compaction reads level 0 from staging when its copies are the replica's; a failed staging read there is classified as a staging fault (`CompactError::Local`, `Fault::from_staging`), never as a replica one. Before, it went through the replica classifier: a full or unreadable staging disk read as a replica fault (a denied read as `credentials`)"

