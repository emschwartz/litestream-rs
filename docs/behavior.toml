table = "Config and startup"
id = "CFG-10"
mark = "none: config parsing is in lsr-config and lsr-cli"
circumstance = "A `dir` entry: which files under it replicate (`config/src/map/dir.rs`). Go's `filepath.Walk` step for step: names in byte order, every path looked at with `lstat`, subdirectories entered only with `recursive`, links never followed as directories, a link to a database kept; a name kept when Go's `filepath.Match` accepts it (`map/pattern.rs`) and one `read` of its first 16 bytes is SQLite's header, bytes past a short read counting as zero. Each database's replica path or URL gains its relative path, escaped as Go's `url.URL` escapes it, and its meta directory is Go's"
response = "continue with the databases Go would replicate, in Go's order, with Go's meta directories and replicas"
signal = "none"
at_risk = "None"
recovery = "n/a"
detected_by = "compat::`go_and_rust_scan_the_same_databases`, config::`a_recursive_dir_keeps_relative_paths_under_a_file_replica`, config::`a_flat_dir_skips_subdirectories_and_files_that_are_not_databases`, config::`a_short_header_read_counts_the_missing_bytes_as_zero`, config::`odd_names_reach_a_url_replica_unchanged`; plant::`dir-header-read-exact`, plant::`dir-url-path-unescaped`"
notes = "The compat test is a differential against Go's own `NewDBsFromDirectoryConfig` (the dumper built from the pinned commit, `crates/compat/src/dump.rs`) over 512 generated trees per run: names a pattern may or may not reach, headers whole, exact, one byte short and absent, nesting, links to databases, to directories and dangling, and `dir` spelled absolute, with a trailing slash, relative, as a link, as a file and missing. It found five differences, all fixed toward Go (CFG-11 to CFG-13, the short header, and names with `\\` or `%`). FIFOs and unreadable files are not generated: both sides block on a FIFO's open (CFG-16), and the tests run as root"

