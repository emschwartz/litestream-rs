[[row]]
table = "Boot"
id = "BOOT-9"
circumstance = "Same salts, but the committed end or the file is shorter than the staged end, or the WAL holds other pages or another commit size in the staged file's range (`recover.rs`)"
response = "snapshot, `LocalRewound`"
signal = "`local_rewound`; `RecoverEvent::LocalRewound`"
at_risk = "The replica holds commits the database lost. They stay restorable by id until retention removes them. The latest state becomes the rewound database (G2). If the regrown WAL is byte-identical in the staged range, nothing is detected and nothing differs"
recovery = "Automatic"
detected_by = "core::`a_committed_end_before_the_newest_staged_file_is_a_rewind`, core::`a_range_regrown_with_another_commit_size_is_a_rewind`, core::`a_shorter_chain_regrown_in_front_of_residue_is_a_rewind_without_the_wal_index`, sim::`power_loss_wal_rewind`, sim::`a_redo_replays_past_the_commits_a_power_loss_took`, sim::`unaided::swarm_seed_44_restores_only_committed_states`; plant::`anchor-any-tail`"
recovered_by = "sim::`power_loss_wal_rewind`, sim::`a_redo_replays_past_the_commits_a_power_loss_took`, sim::`a_power_loss_on_a_lying_disk_leaves_the_replica_restorable_while_it_lies`"
in_review = "#89 keeps the staged snapshot if the process dies before uploading it. On main the next boot deletes it and takes a second one"

[[row]]
table = "Boot"
id = "BOOT-10"
circumstance = "Same salts and length, but the frame before the staged end is not a commit frame, or its page differs from the staged file's"
response = "snapshot, `PrevFrameMismatch` or `LastPageMismatch`. A `LastPageMismatch` that nothing the sweep or the witness passes proved explains rests on one read of the newest staged file: the first boot fails with `StagedLost` and only the next boot that reads the same snapshots (D168)"
signal = "`prev_frame_mismatch`, `last_page_mismatch`"
at_risk = "As BOOT-7"
recovery = "Automatic"
detected_by = "core::`rule_8_a_frame_before_the_end_that_does_not_verify_is_prev_frame_mismatch`, core::`rule_9_a_last_page_that_differs_snapshots`, core::`witness::one_lying_read_of_the_newest_staged_pages_retries_the_boot`, sim::`wal_rewritten_same_length`, sim::`wal_regrown_same_salts_diff_bytes`"
recovered_by = "sim::`wal_rewritten_same_length`, sim::`wal_regrown_same_salts_diff_bytes`"

[[row]]
table = "Boot"
id = "BOOT-11"
circumstance = "A pending staged file is not vouched for by the live WAL: a staging backup put back, a file replaced, a chain from a WAL generation that is gone, or a pending snapshot the WAL can no longer prove. Two witness passes must agree before anything is deleted (`actor.rs`)"
response = "The file and all after it are deleted unpublished. If the position still continues, the WAL stages them again: continue. Otherwise snapshot, `StagedUnverified { from }` Before deleting, the engine has the driver keep a takeover record through what the deleted files vouched for (`Event::TakeoverWanted`, BOOT-30), so a crash before the snapshot does not make the next boot refuse them."
signal = "none, or `staged_unverified`"
at_risk = "When a snapshot follows: the restore points of the deleted files. No committed data"
recovery = "Automatic"
detected_by = "sim::`a_restored_staging_backup_is_not_uploaded_seed_0x1919f`, sim::`a_staged_file_from_another_history_is_not_chained_seed_0x72a`, sim::`pending_from_a_gone_generation`, compat::`go_and_rust_alternate_on_one_prefix`, core::`a_pending_snapshot_the_wal_cannot_prove_is_taken_again`, core::`a_pending_snapshot_short_of_the_replicas_newest_is_refused`; plant::`witness-db-page-under-a-frame`, plant::`witness-snapshot-short`"
recovered_by = "sim::`a_restored_staging_backup_is_not_uploaded_seed_0x1919f`, sim::`a_staged_file_from_another_history_is_not_chained_seed_0x72a`, sim::`pending_from_a_gone_generation`, compat::`go_and_rust_alternate_on_one_prefix`"
notes = "Witness tokens live in memory only, so this fires for the engine's own files after a plain crash whenever the WAL moved on (section 4)"

[[row]]
table = "Boot"
id = "BOOT-12"
circumstance = "The two witness passes disagree"
response = "retry (`LocalIo`): the boot runs again, and deletes nothing"
signal = "\"retrying\""
at_risk = "None"
recovery = "Automatic"
detected_by = "core::`witness_passes_that_disagree_retry_the_boot`"
notes = "One read of a pending file that answers with another valid file (a lying read) makes the passes disagree"

[[row]]
table = "Boot"
id = "BOOT-13"
circumstance = "The replica's newest level-0 object and the staged file under the same key both verify and differ (`upload.rs`). Compared twice"
response = "At boot: **stop**, `OtherWriter`, before anything is written, unless a takeover record covers the replica's newest key: this engine uploads only from witnessed, synced staged copies and keeps a takeover record before deleting its own (BOOT-30), so without an operator's hand the replica's object is another writer's at this engine's next id. With a takeover covering it, or while running with a staged copy that changed under the engine (a backup put back): the replica's object stands, the staged files from it on are deleted (BOOT-30 first) and a snapshot follows above it, `NewestStagedFileUnreadable`"
signal = "`other_writer` and the refusal log line; or `newest_staged_file_unreadable`"
at_risk = "None at a refusal. Otherwise the local commits those staged files held are in the snapshot; their restore points are lost"
recovery = "Operator (`lsr take-over`, or remove the other writer's file); automatic otherwise"
detected_by = "core::`a_verifying_listed_key_unlike_the_staged_file_is_never_written_over`, sim::`a_verifying_replica_object_is_not_written_over_seed_0xc6b2`; core::`second_writer::a_running_engine_stops_when_another_writer_took_its_next_id`; plant::`verifying-object-written-over`, plant::`boot-divergence-snapshots-above-another-writer`"
recovered_by = "sim::`a_verifying_replica_object_is_not_written_over_seed_0xc6b2`"

[[row]]
table = "Boot"
id = "BOOT-14"
circumstance = "The replica's newest level-0 object does not decode, and no usable staged copy exists"
response = "degraded, `RemoteCorrupt`, on the sync task: the boot retries"
signal = "`remote_corrupt`"
at_risk = "Replication does not start. Lag grows without bound"
recovery = "An operator removes or replaces the object"
detected_by = "sim::`remote_bitrot_on_list_read`"
recovered_by = "sim::`remote_bitrot_on_list_read`"
notes = "The scenario flips one byte on one read of a sound object, which heals by itself. An object that stays rotten, and the operator recovery, are **untested**"

[[row]]
table = "Boot"
id = "BOOT-15"
circumstance = "The WAL's page size is not the replica's (`actor.rs`)"
response = "degraded, `PageSizeChanged`, before anything is staged"
signal = "`page_size_changed`"
at_risk = "Replication does not start. The old prefix keeps every state up to the change"
recovery = "Restart onto a new replica prefix"
detected_by = "core::`a_page_size_change_stops_at_boot_before_anything_is_staged`, sim::`a_page_size_change_stops_and_the_old_states_restore`, core::`a_newest_replica_header_that_does_not_decode_still_names_the_page_size`, sim::`a_boot_whose_replica_reads_lie_never_writes_a_new_page_size_seed_0x13`; plant::`replica-page-size-unread`"
survived_by = "sim::`a_page_size_change_stops_and_the_old_states_restore`"
notes = "Fixed on this branch (`claude/survival-tests`): with staging gone and the replica's newest file's header unreadable (rot, or a read a proxy changed), the boot took no page size and snapshotted the new size onto the prefix. It now reads the newest headers in turn, up to eight, and fails `RemoteCorrupt` when none decodes"

[[row]]
table = "Boot"
id = "BOOT-16"
circumstance = "The replica's newest level-0 object is a short or torn object, beside a staged file that verifies"
response = "The staged file is uploaded over it under the same key, unless a level 1 to 9 file already holds that transaction: then the boot stops with `RemoteCorrupt` (D63), since the replacement would give it a second content. When the boot witness then refuses that staged file (BOOT-11), a read (never a listing, which may lag) that finds the key on the replica confirms it as the replica holds it, and the snapshot goes above it: new content never takes a transaction the replica holds"
signal = "none; `remote_corrupt` when a higher level holds the transaction"
at_risk = "None"
recovery = "Automatic"
detected_by = "sim::`corrupt_l0_publish_then_power_loss`, core::`a_tail_checkpointed_away_behind_a_lagging_listing_leaves_the_key_to_the_replica`, core::`a_torn_tail_a_higher_level_file_already_holds_is_not_replaced`; plant::`witness-refused-key-listed`, plant::`torn-tail-replaced-under-a-held-file`"
recovered_by = "sim::`corrupt_l0_publish_then_power_loss`"
in_review = "#96: the tail is read twice before it is judged torn"

[[row]]
table = "Boot"
id = "BOOT-17"
circumstance = "The listing shows two objects that claim one range with different sizes, or a listing whose cursor does not advance"
response = "degraded, `RemoteCorrupt`"
signal = "`remote_corrupt`"
at_risk = "As BOOT-14"
recovery = "Operator"
detected_by = "core::`pages::tests::a_staging_listing_whose_cursor_never_advances_is_a_fault_not_a_loop`; plant::`listing-cursor`"
