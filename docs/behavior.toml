[[row]]
table = "Fail-stop"
id = "FS-7"
circumstance = "Faults that must never trip: a store outage or throttling healed inside the bound, timeouts at boot with nothing unreplicated, a refusal after the first listing inside the bound, maintenance faults, clock steps with a healthy store, restarts and power loss with an honest disk"
