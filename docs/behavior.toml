recovered_by = "sim::`seeds_1_to_8`"

[[row]]
table = "Circumstances the code does not distinguish"
id = "WORLD-22"
circumstance = "A replica object sits in an archive tier or under a disabled KMS key"
response = "An archived object answers 403 `InvalidObjectState`: a refused request, `store_refused`, not an access refusal. A KMS key that is disabled, missing, in the wrong state or of the wrong kind (`KMS.DisabledException`, `KMS.InvalidKeyUsageException`, `KMS.KMSInvalidStateException`, `KMS.NotFoundException`, all 400) is `permission_denied`; a KMS policy refusal arrives as 403 `AccessDenied`, also `permission_denied`. During a restore: exit 3"
signal = "`store_refused` for an archived object, `permission_denied` for a KMS key, on whichever task read it"
at_risk = "The history through that object is unreadable until it is thawed"
recovery = "Operator"
no_test = "untested"
notes = "store-s3::`classify_denials_by_what_to_fix` asserts the archive tier's class and each KMS code's (plant `kms-codes-by-status`). Through the engine, sim::`a_refused_upload_is_reported_as_what_the_operator_must_fix` refuses one upload with `KMS.DisabledException` and requires `permission_denied`; drawn S3 histories answer GETs the same way, once each. A lasting refusal, and an archived object, are not driven through the engine"

[[row]]
table = "Circumstances the code does not distinguish"
id = "WORLD-23"
circumstance = "Object lock, or a policy that denies delete"
response = "Every retention delete fails: a 403 `AccessDenied`, or a batch delete whose result refuses the key, is `StoreDenied(Permission)`, so maintenance is degraded with `permission_denied` for good; sync and upload go on. The retention pin for a degraded task then also applies"
signal = "`permission_denied` on maintenance"
at_risk = "Storage grows without bound"
recovery = "Operator. Turning retention off is the honest configuration"
no_test = "untested"
notes = "store-s3::`a_delete_refused_for_one_key_is_a_permission_denial` asserts the class for a refused key in a batch delete (before, it was a transient failure with no degraded state). Maintenance under a lasting refusal is **untested**"

[[row]]
table = "Circumstances the code does not distinguish"
