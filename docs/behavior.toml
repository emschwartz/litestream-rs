[[row]]
table = "Upload"
id = "UP-11"
mark = "site"
circumstance = "The replica lost files this process confirmed (a bucket rolled back, files deleted under the engine). Seen two ways: an uploader listing shows the replica's newest transaction below what was confirmed (`upload.rs`; the uploader lists only at boot and after an ambiguous commit), or a maintenance listing misses a file this process watched since its last one and a read finds it gone (`core/src/regression_watch.rs`: the last listing's anchor and every level-0 upload since, none of which the engine itself deletes before the next listing). A watched file the listing misses but a read finds is a lagging listing, and nothing is decided"
response = "degraded, `RemoteRegressed`: list again and continue from what the replica holds now. Transaction ids this process already acknowledged are never used again by this process"
signal = "`remote_regressed`"
at_risk = "The files that vanished. The engine does not re-upload them. Until the next snapshot, restores of the latest state refuse with `Gap`. Detection waits for the next maintenance listing, which follows the engine's own upload by at most one compaction window once uploads are idle; uploads above the hole go on until then"
recovery = "Automatic"
detected_by = "sim::`bucket_rolled_back`, sim::`bucket_rolled_back_unseen`, core::`a_relist_never_takes_an_acknowledged_transaction_again`, core::`a_rollback_while_running_is_seen_by_the_next_maintenance_listing`, core::`a_lagging_listing_is_not_a_regression`, core::`regression_watch::tests::missing_names_exactly_the_first_dropped_object`; plant::`relist-acknowledged-mark`, plant::`regression-unwatched`, plant::`regression-unwatched-sim`, plant::`regression-on-listing-alone`"
recovered_by = "sim::`bucket_rolled_back`, sim::`bucket_rolled_back_unseen`"
no_test = "a loss between a boot and its first maintenance listing that removes only what the boot listed: untested"
notes = "That window has no anchor; a loss while the engine is down is BOOT-19. The watch's anchor is the seam for the engine journal, which would let a boot run the same check"
in_review = "#96 adds a read-based mark (`gone`) for the same listings; the two meet in `actor/state.rs`"

