[[row]]
table = "Boot"
id = "BOOT-4"
circumstance = "Staged files above the replica's newest transaction exist (pending uploads). Each is re-derived from the live WAL, read no further than one committed end: it must start where the one before ended, hold exactly the pages a sync would stage, with the same bytes and commit size (`witness.rs`)"
response = "continue: each gets a token and is uploaded"
signal = "none"
at_risk = "None"
recovery = "Automatic"
detected_by = "sim::`a_staging_backup_put_back_while_down_is_refused_at_boot`, core::`frames_past_the_committed_end_prove_no_staged_file`, core::`a_staged_file_whose_bytes_differ_but_still_verify_is_refused`, core::`a_staged_file_replaced_under_a_running_engine_is_never_uploaded`; oracle::`UnwitnessedPut`, plant::`witness-wal-residue`, plant::`witness-byte-digest`, plant::`witness-trailer-compare`"
recovered_by = "sim::`a_staging_backup_put_back_while_down_is_refused_at_boot`"

[[row]]
table = "Boot"
id = "BOOT-5"
circumstance = "A staged file the replica may still need fails verification. First failed read: nothing is deleted, the boot fails with `StagedLost` and runs again. Same file fails on the next try: it and every staged file after it are deleted (`upload.rs`, `actor.rs`). Recovery's own read of the newest staged file is held to the same rule: one that makes it look unreadable fails the boot with `StagedLost` first (D168)"
response = "retry once, then: if recovery continues from the newest file left, continue, and the WAL stages the deleted range again; otherwise snapshot, `NewestStagedFileUnreadable` Before deleting, the engine has the driver keep a takeover record through what the deleted files vouched for (`Event::TakeoverWanted`, BOOT-30), so a crash before the snapshot does not make the next boot refuse them. While running, the same drop leaves its record's ids to the uploader's next listing, never to another-writer judgement (UP-10)."
signal = "\"retrying\", then none or `newest_staged_file_unreadable`"
at_risk = "When a snapshot follows: the restore points of the deleted, unpublished files. Their end state is in the snapshot. No committed data is lost"
recovery = "Automatic"
detected_by = "core::`one_bad_read_of_a_staged_file_at_boot_drops_nothing`, core::`witness::one_lying_read_of_the_newest_staged_header_retries_the_boot`, core::`a_torn_staged_file_the_replica_lacks_is_dropped_and_staged_again_from_the_wal`, core::`a_torn_staged_file_whose_frames_the_wal_lost_costs_a_snapshot`, core::`a_torn_staged_file_the_replica_holds_is_dropped_and_the_snapshot_takes_the_next`, sim::`a_torn_staged_file_is_dropped_seed_0x25`, core::`vouch::a_listing_after_a_running_drop_takes_the_vouched_upload_as_its_own`; plant::`delete-on-one-failed-read-boot`, plant::`boot-snapshot-after-unreadable`"
recovered_by = "sim::`a_torn_staged_file_is_dropped_seed_0x25`"
notes = "A deleted file the replica already holds leaves staging behind the replica, which recovery answers with `BehindRemote`, so continuing never stages new content under a transaction the replica shows. Before, the snapshot was taken even when the WAL could regenerate the files (D14)"

[[row]]
table = "Boot"
id = "BOOT-6"
circumstance = "The replica's newest transaction is above the newest staged file's (`recover.rs`), or staging is empty and the replica is not. The replica's newest level-0 file is read and compared with the live WAL (rule 10's whole-range compare, `actor.rs` `boot_recover`)"
response = "The WAL vouches for it (same salts, same pages and commit size over its range): continue from its end, no snapshot. It does not, and a takeover record (`<meta>/lsr-takeover`) covers the replica's newest transaction: snapshot after it, `BehindRemote`. Neither, and the meta directory is brand new (nothing staged when the boot began, no journal, no takeover record): the replica's state at its newest transaction is restored into one checksum a page and compared with the local committed database (the file overlaid with the WAL up to its committed end); the same page size, page count and pages snapshot after it, as a takeover through it would (D170). Otherwise: stop, `OtherWriter` (BOOT-22). `ContinueAndInterleaveHistories` skips the takeover check and snapshots as Go does"
signal = "none; `behind_remote`; or `other_writer`"
at_risk = "None"
recovery = "Automatic, or the operator's `lsr take-over`"
detected_by = "core::`rule_2_boot_behind_the_remote_snapshots_after_it`, core::`vouch::a_wiped_staging_in_the_same_wal_generation_continues`, core::`vouch::staging_behind_a_replica_the_wal_vouches_for_continues`, core::`vouch::a_vm_restore_stops_until_a_takeover_covers_the_replica`, core::`vouch::a_new_meta_directory_over_the_replicas_own_state_snapshots_above_it`, core::`vouch::a_new_meta_directory_reads_the_local_state_through_the_wal`, core::`vouch::a_new_meta_directory_over_a_different_database_stops`, core::`vouch::a_new_meta_directory_over_a_longer_database_stops`, core::`vouch::a_new_meta_directory_over_a_resized_database_stops_for_the_page_size`, core::`vouch::a_wal_that_moves_under_the_check_retries_the_boot`, core::`vouch::an_old_staging_backup_over_the_replicas_own_state_still_stops`, core::`vouch::a_held_takeover_short_of_the_replica_still_stops_over_its_own_state`, core::`journal::a_journal_with_a_record_keeps_the_new_meta_directory_check_off`, core::`vouch::a_new_meta_directory_with_no_wal_reads_the_database_file_alone`, core::`vouch::a_new_meta_directory_with_no_wal_over_a_longer_database_stops`, core::`vouch::a_new_meta_directory_with_no_wal_over_a_different_database_stops`, sim::`restored_old_meta`, sim::`newest_staged_file_lost`, sim::`vm_restore_stops_until_a_take_over`, replica::`second_writer::a_restored_database_replicates_without_a_refusal`; plant::`boot-gate-wal-vouch-skipped`, plant::`boot-gate-takeover-ignored`"
recovered_by = "sim::`restored_old_meta`, sim::`newest_staged_file_lost`, sim::`vm_restore_stops_until_a_take_over`"
notes = "The swarm's judge fails a refusal with staging intact and no other writer's file standing (`after_refusal` in `sim/src/run.rs`); a refusal after the run disturbed staging is answered with a take-over and a restart, so the run goes on"

[[row]]
table = "Boot"
id = "BOOT-7"
circumstance = "No WAL file, or its header is torn (`actor.rs`, `recover.rs`)"
response = "snapshot, `WalMissing`. The engine first writes one frame of its own so a WAL header exists"
