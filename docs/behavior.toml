[[row]]
table = "Boot"
id = "BOOT-5"
mark = "site"
circumstance = "A staged file the replica may still need fails verification. First failed read: nothing is deleted, the boot fails with `StagedLost` and runs again. Same file fails on the next try: it and every staged file after it are deleted (`upload.rs`, `actor.rs`)"
response = "retry once, then: if recovery continues from the newest file left, continue, and the WAL stages the deleted range again; otherwise snapshot, `NewestStagedFileUnreadable` Before deleting, the engine has the driver keep a takeover record through what the deleted files vouched for (`Event::TakeoverWanted`, BOOT-30), so a crash before the snapshot does not make the next boot refuse them."
signal = "\"retrying\", then none or `newest_staged_file_unreadable`"
at_risk = "When a snapshot follows: the restore points of the deleted, unpublished files. Their end state is in the snapshot. No committed data is lost"
recovery = "Automatic"
detected_by = "core::`one_bad_read_of_a_staged_file_at_boot_drops_nothing`, core::`a_torn_staged_file_the_replica_lacks_is_dropped_and_staged_again_from_the_wal`, core::`a_torn_staged_file_whose_frames_the_wal_lost_costs_a_snapshot`, core::`a_torn_staged_file_the_replica_holds_is_dropped_and_the_snapshot_takes_the_next`, sim::`a_torn_staged_file_is_dropped_seed_0x25`; plant::`delete-on-one-failed-read-boot`, plant::`boot-snapshot-after-unreadable`"
recovered_by = "sim::`a_torn_staged_file_is_dropped_seed_0x25`"
notes = "A deleted file the replica already holds leaves staging behind the replica, which recovery answers with `BehindRemote`, so continuing never stages new content under a transaction the replica shows. Before, the snapshot was taken even when the WAL could regenerate the files (D14)"

[[row]]
table = "Boot"
id = "BOOT-6"
mark = "site"
circumstance = "The replica's newest transaction is above the newest staged file's (`recover.rs`), or staging is empty and the replica is not. The replica's newest level-0 file is read and compared with the live WAL (rule 10's whole-range compare, `actor.rs` `boot_recover`)"
response = "The WAL vouches for it (same salts, same pages and commit size over its range): continue from its end, no snapshot. It does not, and a takeover record (`<meta>/lsr-takeover`) covers the replica's newest transaction: snapshot after it, `BehindRemote`. Neither: stop, `OtherWriter` (BOOT-22). `ContinueAndInterleaveHistories` skips the takeover check and snapshots as Go does"
signal = "none; `behind_remote`; or `other_writer`"
at_risk = "None"
recovery = "Automatic, or the operator's `lsr take-over`"
detected_by = "core::`rule_2_boot_behind_the_remote_snapshots_after_it`, core::`vouch::a_wiped_staging_in_the_same_wal_generation_continues`, core::`vouch::staging_behind_a_replica_the_wal_vouches_for_continues`, core::`vouch::a_vm_restore_stops_until_a_takeover_covers_the_replica`, sim::`restored_old_meta`, sim::`newest_staged_file_lost`, sim::`vm_restore_stops_until_a_take_over`, replica::`second_writer::a_restored_database_replicates_without_a_refusal`; plant::`boot-gate-wal-vouch-skipped`, plant::`boot-gate-takeover-ignored`"
recovered_by = "sim::`restored_old_meta`, sim::`newest_staged_file_lost`, sim::`vm_restore_stops_until_a_take_over`"
notes = "The swarm's judge fails a refusal with staging intact and no other writer's file standing (`after_refusal` in `sim/src/run.rs`); a refusal after the run disturbed staging is answered with a take-over and a restart, so the run goes on"

