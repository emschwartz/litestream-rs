signal = "\"retrying\""
at_risk = "Lag. The application cannot write either"
recovery = "Operator"
detected_by = "sim::`sealed_then_bump_io`"
notes = "injects an I/O error at the bump"

[[row]]
table = "Circumstances the code does not distinguish"
id = "WORLD-18"
circumstance = "What application writers see of the engine's write barrier"
response = "During each PASSIVE checkpoint (every 1000 frames or 1 minute) the engine holds a write transaction across a sync step, the checkpoint and its release. Writers block for that time and need a `busy_timeout` longer than it. During a boundary snapshot (CKPT-4) the write lock is held for a full read and staging of the database. No bound on either is stated or measured"
signal = "none"
at_risk = "Application write latency, and `SQLITE_BUSY` for writers with a short timeout"
recovery = "n/a"
no_test = "untested"
notes = "None"

[[row]]
table = "Circumstances the code does not distinguish"
id = "WORLD-19"
circumstance = "Power loss under `synchronous=NORMAL`"
response = "See the fault model: the database loses acknowledged commits by SQLite's contract; the replica does not run ahead on an honest disk; the boot rows decide"
signal = "by boot row"
at_risk = "The database's own loss, which is not the engine's. The replica is at most as far as the last fsynced WAL"
recovery = "Automatic"
detected_by = "sqlite::`a_power_cut_after_a_settle_leaves_the_database_at_least_as_far_as_the_replica`, sqlite::`power_loss_at_each_wal_sync_loses_no_acknowledged_transaction`"
recovered_by = "sqlite::`a_power_cut_after_a_settle_leaves_the_database_at_least_as_far_as_the_replica`, sqlite::`power_loss_at_each_wal_sync_loses_no_acknowledged_transaction`"
notes = "LazyFS"

[[row]]
