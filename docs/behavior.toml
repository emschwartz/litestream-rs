[[row]]
table = "Running"
id = "RUN-19"
mark = "site"
circumstance = "The clock reads earlier than its last reading (`actor/clock.rs`)"
response = "Engine time keeps its value and then advances at half the wall clock's rate until the wall clock catches up (after twice the step); every timer (retry waits, the checkpoint schedule, compaction windows, retention) uses engine time. The reading that steps back ends the tick and is reported. The wake handed to the host is wall time. File stamps take the wall clock, never below its highest reading"
signal = "Event `Clamped`, log \"clock went backwards\""
at_risk = "Files staged until the wall clock passes its highest reading all carry that reading; as-of restores inside the window cannot tell them apart"
recovery = "Automatic"
detected_by = "core::`a_backward_clock_step_does_not_freeze_a_retry_wait`, core::`engine_time_rejoins_the_wall_clock_after_a_step_back`, core::`clock_back_clamped_once`, sim::`clock_steps_back_10s`, sim::`clock_steps_back_an_hour_mid_retry`; plant::`clock-step-back-freezes-timers`, plant::`clock-step-back-freezes-timers-sim`"
recovered_by = "sim::`clock_steps_back_10s`, sim::`clock_steps_back_an_hour_mid_retry`"
notes = "Timers run at half speed for twice the step. Comparisons of stamps with engine time (the snapshot schedule) see files as older by at most half the step; retention anchors on the replica's newest stamp"

