table = "Boot"
id = "BOOT-30"
mark = "none: not yet placed: a takeover row added after the marks; its branches are in core/src/takeover.rs and lsr-replica"
circumstance = "The engine is about to delete staged files the replica may hold: a staged copy that turned unreadable (BOOT-5), a divergence (BOOT-13), a pending file the WAL no longer vouches for (BOOT-11), at boot or while running"
response = "It asks the driver for a takeover record through what staging vouched for (`Actor::takeover_wanted`, `Event::TakeoverWanted`) and deletes nothing until the driver hands it back. At boot: the newest staged transaction, capped at the replica's newest listed level-0 key (a key the listing judged torn counts). While running: the newest staged transaction, capped only by a key the replica is known to end at. A record already held that covers it is enough. The replicator writes `<meta>/lsr-takeover` by scratch, fsync, rename and directory fsync, then hands it back"
signal = "`TakeoverWanted`; `TakeoverNotRecorded` when the write fails"
at_risk = "None"
recovery = "Automatic"
detected_by = "core::`vouch::a_crash_between_the_engines_own_drop_and_its_snapshot_is_not_a_refusal`, core::`vouch::a_takeover_the_driver_cannot_write_keeps_the_staged_files_and_waits`, sim::`survival::an_unconfirmed_upload_dropped_from_staging_is_never_refused_seed_0xd`, sim::`survival::a_running_drop_records_past_an_unconfirmed_upload_seed_0xf45b5`, sim::`survival::a_tail_judged_torn_and_dropped_from_staging_is_never_refused_seed_0x3ed`; plant::`takeover-before-drop-skipped`, plant::`takeover-before-drop-skipped-sim`, plant::`running-drop-record-capped-at-confirmed`, plant::`boot-drop-record-capped-at-confirmed`, plant::`takeover-ask-spins`"
recovered_by = "sim::`survival::an_unconfirmed_upload_dropped_from_staging_is_never_refused_seed_0xd`"
notes = "A write that fails hands nothing back: the next ask fails `LocalIo` and waits its backoff, and nothing is deleted unrecorded. Pending files above every replica key vouch for nothing there, so a forged one never raises the record"

[[row]]
table = "Boot"
id = "BOOT-31"
mark = "none: not yet placed: an ahead-of-WAL row added after the marks; its branches are in core/src/ahead.rs and core/src/actor/ahead.rs"
circumstance = "A boot restores a WAL-sync debt from the engine journal while the WAL is still the newest staged file's generation, and database-file pages no WAL frame covers are not their images at the newest staged transaction: a checkpoint copied frames the failed sync covered, and a power loss or eviction then lost them from the WAL (`core/src/ahead.rs`, `docs/decisions.md` D103)"
response = "The first sync step after boot is the check, before the TRUNCATE. A clean file: the TRUNCATE and the snapshot follow as in RUN-3. Pages that differ: the verdict is journalled, the file is replicated as the application serves it, the sync task is degraded at `DatabaseAheadOfWal` until the cure's next step succeeds (under `STRICT`: stop, once), and retention keeps the newest staged transaction for seven days"
signal = "`database_ahead_of_wal` in `Health.degraded` while degraded, then `Health.ahead_of_wal`, `/healthz` `database_ahead_of_wal` and `lsr_database_ahead_of_wal` until the window ends; the degraded event logged at error level, a boot inside the window and the window's end logged (`Event::AheadOfWal`, `Kept` and `Released`)"
at_risk = "The commits the WAL lost, which no restore brings back. The latest state is the damaged file; the state before it is restorable for seven days"
recovery = "Automatic. The notice and the kept restore point end seven days after the verdict, across restarts"
detected_by = "core::`a_boot_with_a_debt_reports_pages_from_commits_the_wal_lost`, core::`a_boot_with_a_debt_whose_file_kept_its_pages_comes_up_clean`, core::`a_recorded_verdict_stops_once_under_strict_responses`, core::`the_restore_point_is_kept_for_the_window_across_a_restart`, sidecar::`a_database_ahead_of_its_wal_is_a_notice_in_both_outputs`; plant::`debt-boot-skips-page-check`, plant::`ahead-verdict-not-journaled`, plant::`ahead-truncate-before-check`, plant::`ahead-check-counts-covered-pages`, plant::`ahead-restore-point-released-early`, plant::`ahead-window-restarts-at-boot`, plant::`ahead-notice-never-ends`"
notes = "The simulator reaches it (seed 0x585, known-wrong cell `DatabaseAheadOfWal`); its world does not yet adopt the mixed state as damage, so it is caught by the simulator's model check, and the cell flips once the judge allows a restore at the kept restore point. A page above the newest staged size that no frame covers is not checked. Holding the read mark at the proven frame cannot prevent the mix (D104)"

