    "a_torn_staged_file_is_dropped_seed_0x2d",
    "a_torn_staged_file_is_dropped_seed_0x46",
    "page_size_vacuum_and_staging_wipe_seed_0x126d68ef545f",
    "a_put_back_staged_file_never_sends_latest_back_seed_0x126d68fae16b",
]
# A failed sync of the WAL taken as a success: the frames it covered are staged, though the
# kernel may never write them. The simulator's lost writeback and its staged-durability check
# see it too (`wal_fsync_fails`), as does the actor's unit test.
[[bug]]
name = "wal-sync-error-as-success"
fix = "claude/wal-sync-failed"
package = "lsr-sqlite"
test_bin = "sqlite"
tests = ["a_failed_wal_sync_stages_nothing_of_its_generation_and_snapshots_after_a_truncate"]

# After a failed sync of the WAL, the retry syncs again and trusts the success: the generation's
# frames the failure covered are staged. Only the simulator models the lost writeback (the real
# kernel's pages stay readable from the page cache), so it is the one that sees bytes a power
# loss would take.
[[bug]]
name = "wal-trusted-after-failed-sync"
fix = "claude/wal-sync-failed"
package = "lsr-sim"
test_bin = "sim"
tests = ["faults::wal_fsync_fails"]

