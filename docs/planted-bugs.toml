# A running position pinned at the first frame of a generation with no frames does not follow the
# new header SQLite writes with random salts (checkpoint sequence 0): a second whole snapshot. The
# sim's liveness oracle catches it too, now that a change under a held read lock justifies nothing
# (liveness::a_new_wal_header_over_an_empty_pinned_generation_is_followed, seed 0xf4846).
[[bug]]
name = "mark-zero-empty-generation"
fix = "claude/rewound-snapshot"
package = "lsr-core"
tests = [
    "recover::tests::rule_6_a_pinned_position_with_no_frames_follows_a_new_header_with_any_salts",
]

# A sequence bump ran on the writer connection whatever state it was in: under a lock it ran
# inside the lock's transaction, and after a release whose ROLLBACK failed it ran inside the
# leftover one, so the next lock's release rolled it back unseen. Found by the differential of
# the simulator's SQLite model against this crate (crates/sqlite/tests/sqlite/sim_model.rs).
[[bug]]
name = "bump-inside-leftover-writer-transaction"
fix = "claude/sqlite-writer-reset"
package = "lsr-sqlite"
tests = [
    "checkpoint::tests::a_bump_after_a_release_that_failed_is_committed",
    "checkpoint::tests::a_bump_under_a_lock_is_refused",
]

# The compactor took its output's commit acknowledgement as given: a store that acknowledged
# the output short left a truncated level-N file, maintenance reported it compacted, and a later
# restore of the latest state could not decode it. Every engine commit is now checked
# (crates/core/src/checked.rs); this patch opens the compactor's upload around the check.
[[bug]]
name = "compact-commit-unchecked"
fix = "claude/commit-size"
package = "lsr-core"
tests = ["compact::tests::an_output_acknowledged_short_is_deleted_and_reported"]

