# The planted-bug ledger (docs/planted-bugs.md). One entry per defect fixed on main:
# `just planted-bugs` re-introduces each one by applying its `patch` to a scratch copy of the tree
# and fails unless every test in `tests` passes on the clean tree and fails on the planted one.
#
#   name     short unique name; the patch is docs/planted-bugs/<name>.patch
#   fix      the commit that fixed it (provenance; the patch is its production change re-expressed
#            against the current tree, because later renames stop the commit's own diff applying)
#   package  the cargo package whose tests are run
#   tests    nextest name substrings (`test(~x)`); each must fail when planted, one run apiece
#   test_bin optional: restrict the run to one integration-test binary (cargo `--test`)
#   patch    optional: the patch's name when it is not `name`, so one defect can be planted
#            against the tests of a second package
#   (an entry whose `fix` is "plant" is no fixed defect: it proves a checker catches a bug class
#   it was built for, with the checker's own test named)
#   canary   optional, on the two canary entries only: the verdict the runner must report,
#            `survived` (the no-op patch) or `killed` (the patch that breaks a test for certain).
#            Any other verdict on a canary fails the run: the runner itself is broken.
#   bin      optional: run the unit tests of one binary target (cargo `--bin`), for a package
#            with no library, such as lsr-cli
#
# Not here, with the reason: a6e3e38 (level-0 retention oracle: it fixed the test, retention code is
# unchanged, so there is nothing to plant), the verify hang fix (test-only: no production code to plant)
# ab0021d (a feature: reverting it does not compile). Retired with the code they planted into:
# staged-file-cannot-follow (bf78f6d) and staged-snapshot-of-earlier-wal (be104a7), the listing's header
# link between a staged file and the replica's newest, which the boot witness replaced (2fb603f); the
# rules they guarded are planted below as the witness-* entries. page-size-after-vacuum (b352aba): its
# arm (an unusable newest staged file still names its page size) decides only with an empty replica,
# where every staged file is pending and the boot witness now deletes an unusable one first.
# other-writer-stop-forgotten-sim (a9da6c6): since a boot refuses replica files that neither the
# WAL nor a takeover record vouches for, a restart after a stop for another writer's file above
# staging stops again with or without the stop record, so the scenario cannot tell; the record
# still decides the case of another writer at the engine's next id, which the core entry plants.
# replica-page-size-unread-sim (7bf9707): seed 0x13's run no longer reaches the boot it pinned
# once the engine asks for a takeover record before deleting staged files (one more tick changes
# the interleaving); the test stays as a regression run, and the core entry plants the defect.
# other-writer-stop-forgotten (a9da6c6) and stop-record-not-kept (a939338): the stop record they
# planted into is gone (68d2d90). A restart after a stop for another writer now stops by the
# boot's refusal: of files above staging (boot-gate-refuses-nothing) or of a divergence under the
# engine's next id (boot-divergence-snapshots-above-another-writer).

