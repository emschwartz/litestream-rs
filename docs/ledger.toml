"TestWALReader" = { counterpart = "lsr-wal::wal::synthetic::scan_yields_each_transaction_then_a_clean_end" }
"TestWALReader/BadHeaderChecksum" = { reason = "Rust deliberately differs: Go treats a WAL whose header checksum fails as empty (io.EOF); Rust refuses it as a typed header error (lsr-wal::wal synthetic::header_checksum_mismatch), so a corrupt WAL is never read as no WAL (docs/PLAN.md phase 3: a checksum mismatch is never end-of-WAL)." }
"TestWALReader/BadHeaderVersion" = { counterpart = "lsr-wal::wal::synthetic::header_unsupported_version" }
"TestWALReader/BadMagic" = { counterpart = "lsr-wal::wal::synthetic::header_bad_magic" }
"TestWALReader/ErrBufferSize" = { counterpart = "lsr-wal::wal::synthetic::read_page_buffer_size" }
"TestWALReader/ErrContextCanceled" = { reason = "Go-only: context.Context cancellation. The Rust core is sans-IO and advances one tick at a time (docs/PLAN.md section 2, goal 5); there is no context to cancel, and shutdown is final_sync with a deadline." }
"TestWALReader/ErrContextCanceledWithOffset" = { reason = "Go-only: context.Context cancellation. The Rust core is sans-IO and advances one tick at a time (docs/PLAN.md section 2, goal 5); there is no context to cancel, and shutdown is final_sync with a deadline." }
