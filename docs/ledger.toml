# The upstream-test ledger: every Go test at the pinned upstream commits (litestream
# 041a8c3, ltx v0.5.3), as listed in docs/ledger/upstream-tests.txt by
# scripts/upstream-tests.sh, mapped to exactly one of:
#   counterpart = "<nextest binary id>::<test path>" (or a list): Rust tests that check
#                 the same behaviour, each present in docs/ledger/rust-tests.txt;
#   reason      = why the test does not apply (not in v1, a Go-only detail, or covered
#                 differently by a named Rust test);
#   missing     = what a Rust test should check: the work list.
# One table per upstream file; keys are `TestX` or `TestX/subtest` as the script prints
# them. crates/compat/tests/ledger.rs checks the whole file in `just check`. After
# adding or renaming a Rust test, `just ledger` refreshes both listings.

