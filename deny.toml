[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
unmaintained = "workspace"
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"

[licenses]
version = 2
# Allowlist: a dependency under any other license gets a decision before it lands.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots (Mozilla's roots for ureq's rustls, ruling F4) and webpki-root-certs
    # (the platform verifier's fallback under the store's `reqwest` feature).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
