[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
unmaintained = "workspace"
ignore = [
    # url 2.5.8: stack overflow in `Url::origin()` on nested `blob:` URLs. No
    # workspace code calls `Url::origin`, and the only URLs parsed are replica
    # URLs (`s3://`, `file://`) from the operator's own config. The fix, 2.5.9,
    # is inside the 3-day publish cooldown (.cargo/config.toml) until
    # 2026-11-24; bump with `cargo update -p url` then and delete this entry.
    { id = "RUSTSEC-2026-0592", reason = "Url::origin unused; fix inside publish cooldown until 2026-11-24" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own path dependencies carry no version; every crate is `publish = false`.
allow-wildcard-paths = true

[licenses]
version = 2
# Allowlist: a dependency under any other license gets a decision before it lands.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots (Mozilla's roots: the S3 store's fallback when the system holds none,
    # as Go's x509roots/fallback; docs/plans/phase-1-reading.md, ruling F4 as amended) and
    # webpki-root-certs (rustls-platform-verifier's roots on wasm only, in the lock).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
