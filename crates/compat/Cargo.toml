[package]
name = "lsr-compat"
version = "0.0.0"
description = "Dev-only harness: pinned Go litestream binaries, seeded workloads, golden replica fixtures."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lsr-core = { path = "../core", features = ["testing"] }
lsr-local = { path = "../local" }
lsr-ltx = { path = "../ltx" }
lsr-store-fs = { path = "../store-fs" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
