[package]
name = "lsr-ltx"
version = "0.0.0"
description = "The LTX v3 file format: identifiers, checksums, decoder and strict encoder."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crc = "3.4.0"
lz4_flex = { version = "0.14.2", default-features = false, features = ["std", "safe-decode", "safe-encode"] }
thiserror = "2.0.21"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
sha2 = "0.11.1"
