[package]
name = "lsr-ltx"
version = "0.0.0"
description = "The LTX v3 file format: identifiers, checksums, decoder and strict encoder."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `testing::encode_commit_zero`, for tests in other crates that need a file the
# strict encoder refuses; and `PageIndex` and `decode_frame`, which read one page
# out of order with no checksum over it, for the fuzz targets and the tests.
testing = []

[dependencies]
crc-fast.workspace = true
jiff.workspace = true
lz4_flex.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The integration tests read pages out of order.
lsr-ltx = { workspace = true, features = ["testing"] }
# The second, independent CRC-64 the SIMD one is tested against (tests/ltx/common.rs and checksum.rs).
crc.workspace = true
proptest.workspace = true
sha2.workspace = true
