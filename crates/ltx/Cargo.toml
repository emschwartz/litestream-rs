[package]
name = "lsr-ltx"
version = "0.0.0"
description = "The LTX v3 file format: identifiers, checksums, decoder and strict encoder."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test and fuzz access: an encoder for files the strict one refuses, and unchecked
# out-of-order page reads (`PageIndex`, `decode_frame`).
testing = []

[dependencies]
crc-fast.workspace = true
jiff.workspace = true
lz4_flex.workspace = true
thiserror.workspace = true

[dev-dependencies]
lsr-ltx = { workspace = true, features = ["testing"] }
# An independent CRC-64 to test the SIMD one against.
crc.workspace = true
proptest.workspace = true
sha2.workspace = true
