[package]
name = "lsr-core"
version = "0.0.0"
description = "Replica layout, the object-store contract and its in-memory reference model."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The store conformance suite and the adapter to the restore-plan spec (`spec_view`).
testing = ["verify", "dep:lsr-spec"]
# Expensive self-checks (`lsr_core::VERIFY`); never on in a release build.
verify = []

[dependencies]
lsr-ltx.workspace = true
lsr-wal.workspace = true
crc-fast.workspace = true
thiserror.workspace = true
lsr-spec = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true, features = ["default"] }
rusqlite = { workspace = true, features = ["bundled", "cache"] }
tempfile.workspace = true
lsr-ltx = { workspace = true, features = ["testing"] }
lsr-core = { workspace = true, features = ["testing"] }
lsr-spec.workspace = true

[lints]
workspace = true