[package]
name = "lsr-core"
version = "0.0.0"
description = "Replica layout, the object-store contract and its in-memory reference model."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The shared store conformance suite, for the crates that implement ObjectStore.
# Also the adapter to the restore-plan spec (`spec_view`), so tests judge the planner by it.
testing = ["verify", "dep:lsr-spec"]
# Expensive self-checks (`lsr_core::VERIFY`): on in the sim, fuzz and tests through
# `testing`, off in release builds of the cli and sidecar.
verify = []

[dependencies]
lsr-journal.workspace = true
lsr-ltx.workspace = true
lsr-wal.workspace = true
thiserror.workspace = true
# Test-only (the `testing` feature): the contract oracle the planner is judged by.
lsr-spec = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true, features = ["default"] }
# The differential sync test runs real SQLite: bundled so no system library is needed.
rusqlite = { workspace = true, features = ["cache"] }
tempfile.workspace = true
lsr-ltx = { workspace = true, features = ["testing"] }
# The integration tests drive stores with `conformance::block_on`.
lsr-core = { workspace = true, features = ["testing"] }
# The planner tests name the spec's judgement; the adapter is `lsr_core::spec_view`.
lsr-spec.workspace = true
# The journal differential test writes a newer version's record by hand.
crc.workspace = true
# The memory gates (tests/core/mem.rs) count heap through this allocator.
lsr-heap.workspace = true

[lints]
workspace = true
