[package]
name = "lsr-core"
version = "0.0.0"
description = "Replica layout, the object-store contract and its in-memory reference model."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The shared store conformance suite, for the crates that implement ObjectStore.
testing = []

[dependencies]
lsr-ltx = { path = "../ltx" }
thiserror = "2"

[dev-dependencies]
proptest = "1"
lsr-ltx = { path = "../ltx", features = ["testing"] }

[lints]
workspace = true
