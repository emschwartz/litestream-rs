[package]
name = "lsr-cli"
version = "0.0.0"
description = "The `lsr` command: restore, verify and list a Litestream file replica."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lsr"
path = "src/main.rs"

[dependencies]
lsr-core.workspace = true
lsr-ltx.workspace = true
lsr-config.workspace = true
lsr-replica.workspace = true
lsr-sidecar.workspace = true
lsr-store-fs.workspace = true
lsr-store-s3.workspace = true
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
lsr-compat.workspace = true
# The `-exec` child in tests/cli/sidecar.rs watches signals as a real child would.
signal-hook.workspace = true
# The replicate process test sets up its own application connection as an application must.
lsr-sqlite.workspace = true
lsr-core = { workspace = true, features = ["testing"] }
# FakeS3 drives the S3 path in-process, and the Tigris run's cleanup lists and aborts
# multipart uploads with the store's raw requests; both sit behind the feature.
lsr-store-s3 = { workspace = true, features = ["testing"] }
# The Tigris run (tests/cli/tigris.rs) checkpoints the live database Go replicated.
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
