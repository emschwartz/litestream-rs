[package]
name = "lsr-cli"
version = "0.0.0"
description = "The `lsr` command: restore, verify and list a Litestream file replica."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lsr"
path = "src/main.rs"

[dependencies]
lsr-core.workspace = true
lsr-local.workspace = true
lsr-ltx.workspace = true
lsr-replica.workspace = true
lsr-store-fs.workspace = true
lsr-store-s3.workspace = true
signal-hook.workspace = true
thiserror.workspace = true

[dev-dependencies]
lsr-compat.workspace = true
# The replicate process test sets up its own host connection as a host must.
lsr-sqlite.workspace = true
lsr-core = { workspace = true, features = ["testing"] }
# FakeS3 drives the S3 path in-process; it sits behind the feature.
lsr-store-s3 = { workspace = true, features = ["testing"] }
# The Tigris run (tests/tigris.rs) checkpoints the live database Go replicated.
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
