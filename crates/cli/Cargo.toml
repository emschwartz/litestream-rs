[package]
name = "lsr-cli"
version = "0.0.0"
description = "The `lsr` command: replicate SQLite databases to a Litestream replica, and restore, verify and list one."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lsr"
path = "src/main.rs"

[dependencies]
lsr-core.workspace = true
lsr-ltx.workspace = true
lsr-config.workspace = true
lsr-replica.workspace = true
lsr-sidecar.workspace = true
lsr-store-fs.workspace = true
lsr-store-s3.workspace = true
clap.workspace = true
# The crypto provider the binary installs at the start of main.
rustls = { workspace = true, features = ["aws-lc-rs", "std"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
lsr-compat.workspace = true
signal-hook.workspace = true
lsr-sqlite = { workspace = true, features = ["rusqlite"] }
lsr-core = { workspace = true, features = ["testing"] }
lsr-store-s3 = { workspace = true, features = ["testing"] }
rusqlite = { workspace = true, features = ["bundled", "backup"] }
tempfile.workspace = true

[lints]
workspace = true
