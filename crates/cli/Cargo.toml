[package]
name = "lsr-cli"
version = "0.0.0"
description = "The `lsr` command: restore, verify and list a Litestream file replica."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lsr"
path = "src/main.rs"

[dependencies]
lsr-core = { path = "../core" }
lsr-local = { path = "../local" }
lsr-ltx = { path = "../ltx" }
lsr-store-fs = { path = "../store-fs" }
lsr-store-s3 = { path = "../store-s3" }
thiserror = "2"

[dev-dependencies]
lsr-compat = { path = "../compat" }
lsr-core = { path = "../core", features = ["testing"] }
# FakeS3 drives the S3 path in-process; it sits behind the feature.
lsr-store-s3 = { path = "../store-s3", features = ["testing"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
