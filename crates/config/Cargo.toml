[package]
name = "lsr-config"
version = "0.0.0"
description = "Go Litestream's litestream.yml, read as Go reads it, with litestream-rs's refusals and warnings."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lsr-core.workspace = true
lsr-replica.workspace = true
lsr-store-fs.workspace = true
lsr-store-s3.workspace = true
percent-encoding.workspace = true
saphyr-parser.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
lsr-core = { workspace = true, features = ["testing"] }
lsr-ltx.workspace = true
lsr-store-s3 = { workspace = true, features = ["testing"] }
proptest.workspace = true
# The S3 store resolves the process crypto provider when it opens, and this crate enables none,
# so the store tests pass alone only with one named here (the workspace build gets it elsewhere).
rustls = { workspace = true, features = ["aws-lc-rs", "std"] }
tempfile.workspace = true

[lints]
workspace = true
