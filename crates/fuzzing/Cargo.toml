[package]
name = "lsr-fuzzing"
version = "0.0.0"
description = "Fuzz targets as plain functions over bytes, replayed over a committed corpus in the test suite."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lsr-core = { workspace = true, features = ["testing"] }
# The `index` target reads one page out of order, which only the testing feature offers.
lsr-ltx = { workspace = true, features = ["testing"] }
lsr-wal.workspace = true

[dev-dependencies]
# `WalBuilder` for the seeds and the target's own tests.
lsr-wal = { workspace = true, features = ["testing"] }
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
