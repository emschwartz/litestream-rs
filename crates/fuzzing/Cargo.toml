[package]
name = "lsr-fuzzing"
version = "0.0.0"
description = "Fuzz targets as plain functions over bytes, replayed over a committed corpus in the test suite."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arbitrary.workspace = true
lsr-core = { workspace = true, features = ["testing"] }
lsr-ltx = { workspace = true, features = ["testing"] }
lsr-wal.workspace = true
lsr-spec.workspace = true

[dev-dependencies]
lsr-wal = { workspace = true, features = ["testing"] }
rusqlite = { workspace = true, features = ["bundled"] }
tempfile.workspace = true

[lints]
workspace = true
