[package]
name = "lsr-replica"
version = "0.0.0"
description = "The public API: a replicator thread per database, its health, restore and verify over the same store, and the local restore sink."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["bundled"]
# SQLite compiled from libsqlite3-sys's bundled source. Turn it off (`default-features = false`)
# to link the application's own SQLite, which must be one of the builds lsr-sqlite lists.
bundled = ["lsr-sqlite/bundled"]
# `Replicator::app_connection` on a rusqlite connection (any rusqlite from 0.39 to 0.43).
rusqlite = ["dep:rusqlite", "lsr-sqlite/rusqlite"]
# `Runtime::fake`: a clock that moves when a test says so, and a park that waits on it.
testing = ["lsr-core/testing"]
# Test builds only (`just check` turns it on through --all-features): every thread `stack::spawn`
# starts gets half its shipped stack, so the suites prove the shipped size has twice the depth
# they reach. A release build refuses it.
test-half-stack = []

[dependencies]
lsr-core.workspace = true
lsr-ltx.workspace = true
lsr-sqlite.workspace = true
lsr-store-fs.workspace = true
# The `file:` URI the integrity check opens a restored database by.
percent-encoding.workspace = true
rusqlite = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
lsr-replica = { workspace = true, features = ["rusqlite", "testing"] }
proptest.workspace = true
tempfile.workspace = true

# Schedule exploration, compiled only under `--cfg shuttle` (`just shuttle`).
[target.'cfg(shuttle)'.dev-dependencies]
shuttle.workspace = true

[lints]
workspace = true
