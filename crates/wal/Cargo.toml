[package]
name = "lsr-wal"
version = "0.0.0"
description = "The SQLite WAL reader: header and frame verification, committed transactions, page maps."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `testing::WalBuilder`, a hand-built WAL writer for tests in other crates.
testing = []

[lints]
workspace = true

[dependencies]
lsr-ltx.workspace = true
thiserror.workspace = true

[dev-dependencies]
lsr-wal = { workspace = true, features = ["testing"] }
proptest.workspace = true
rusqlite = { workspace = true, features = ["bundled", "cache"] }
tempfile.workspace = true
