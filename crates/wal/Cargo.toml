[package]
name = "lsr-wal"
version = "0.0.0"
description = "The SQLite WAL reader: header and frame verification, committed transactions, page maps."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lsr-ltx = { path = "../ltx" }
thiserror = "2.0.21"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"
