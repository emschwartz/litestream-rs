[package]
name = "lsr-sqlite"
version = "0.0.0"
description = "The sync engine's doors on a live SQLite database: the read transaction that pins the WAL, the wal-index and pages through SQLite's own file handle, and the checkpoint."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["bundled"]
# SQLite from libsqlite3-sys's bundled source. Off, the system's or application's SQLite is
# linked, and must be a build the `version` module lists.
bundled = ["libsqlite3-sys/bundled"]
# The application-connection helpers on a rusqlite connection.
rusqlite = ["dep:rusqlite"]
# The fault-injecting VFS and the real-SQLite fault harness.
testing = ["dep:lsr-sim", "dep:lsr-store-fs", "dep:rustix", "lsr-core/testing", "rusqlite", "rusqlite/serialize", "rusqlite/bundled"]

[dependencies]
lsr-core.workspace = true
lsr-ltx.workspace = true
lsr-sim = { workspace = true, optional = true }
lsr-store-fs = { workspace = true, optional = true }
lsr-wal.workspace = true
libsqlite3-sys.workspace = true
rustix = { workspace = true, features = ["fs"], optional = true }
rusqlite = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
lsr-core = { workspace = true, features = ["testing"] }
rusqlite = { workspace = true, features = ["bundled", "limits", "hooks"] }
lsr-sqlite = { workspace = true, features = ["bundled", "testing"] }
lsr-replica.workspace = true
lsr-history.workspace = true
tempfile.workspace = true
proptest.workspace = true
