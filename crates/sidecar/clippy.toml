# Clippy reads the nearest clippy.toml only, so this repeats the root file in full
# and adds the descriptor rule: a closed descriptor on the database drops the read lock's locks.
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true

# TigerStyle's limit; see docs/PLAN.md.
too-many-lines-threshold = 70

# Time and sleep come in through `Clock`, `Sleeper` and the tick's `now`, so the
# simulator and tests can stub them (PLAN.md section 2, goal 5).
#
# No descriptor on a database or its `-shm` may be opened and closed in this
# crate: closing any descriptor on a file drops every POSIX lock the process
# holds on it, the read lock's read-mark lock included. Replicators open their files
# through SQLite, and the directory scan reads headers in lsr-config before any
# replicator starts.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "take a `Clock` (lsr_core::Clock) or the tick's `now`" },
    { path = "std::time::Instant::now", reason = "take a `Clock`, or a deadline from the caller" },
    { path = "std::thread::sleep", reason = "take a `Sleeper` (lsr_core::Sleeper)" },
    { path = "jiff::Timestamp::now", reason = "take a `Clock` (lsr_core::Clock)" },
    { path = "std::fs::File::open", reason = "a closed descriptor on a database or -shm drops the read lock's locks" },
    { path = "std::fs::OpenOptions::open", reason = "a closed descriptor on a database or -shm drops the read lock's locks" },
    { path = "std::fs::read", reason = "opens and closes a descriptor; on a database or -shm that drops the read lock's locks" },
]
