[package]
name = "lsr-store-s3"
version = "0.0.0"
description = "ObjectStore on an S3-compatible bucket: sans-IO requests, responses and error classification."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ureq"]
# The in-memory S3 (FakeS3), the recorded-fault layer and test-only request edits.
testing = ["dep:md-5"]
# HTTP clients, any combination: `UreqTransport` (blocking, no runtime; the
# default and what `S3Store::new` uses) and `ReqwestTransport` (for applications that
# already build reqwest and Tokio). The clients the store builds itself trust
# the system's roots (the operating system's verifier on macOS and Windows), or Mozilla's
# when a Linux or BSD system has none (the `trust` module).
ureq = ["dep:ureq", "dep:rustls", "dep:rustls-native-certs"]
# TLS: the clients take the crypto provider rustls resolves, and this crate enables none, so it
# never links ring or aws-lc-rs itself: the provider the application installed with
# `rustls::crypto::CryptoProvider::install_default`, else the one provider rustls's features
# enable in the application's build. When rustls cannot pick, building a client is
# `ConfigError::NoTlsProvider` (docs/decisions/D249.md).
reqwest = [
    "dep:reqwest",
    "dep:rustls",
    "rustls/tls12",
    "dep:rustls-platform-verifier",
    "dep:rustls-native-certs",
    "dep:tokio",
    "dep:webpki-roots",
]
# For an application that hands `ReqwestTransport` a reqwest client on native-tls: its TLS
# failures are classified as such (they are not rustls errors). Enables reqwest's own
# `native-tls`, which such an application has on already.
native-tls = ["reqwest", "dep:native-tls", "reqwest/native-tls"]

[dependencies]
lsr-core.workspace = true
lsr-ltx.workspace = true
base64.workspace = true
hex.workspace = true
hmac.workspace = true
jiff.workspace = true
md-5 = { workspace = true, optional = true }
# SigV4's query encoding; FakeS3 also decodes listed keys.
percent-encoding.workspace = true
rusty-s3.workspace = true
# The JSON documents the container, instance-metadata and process sources answer with.
serde_json.workspace = true
# SHA-256 of every request body, signed (sigv4.rs); it uses the CPU's SHA instructions.
sha2.workspace = true
thiserror.workspace = true
ureq = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
# Root certificates from the system; for reqwest also its TLS config on ring,
# and recognising a TLS failure inside reqwest's error chain.
rustls = { workspace = true, optional = true, features = ["std"] }
tokio = { workspace = true, optional = true, features = ["time"] }
native-tls = { workspace = true, optional = true }
url.workspace = true
zeroize.workspace = true

# Linux and the BSDs: the system's root files through rustls-native-certs, and Mozilla's roots
# when it finds none (ureq carries its own copy).
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
rustls-native-certs = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

# macOS and Windows: the operating system's verifier, which applies its revocation and
# trust policy, as Go does there.
[target.'cfg(not(all(unix, not(target_vendor = "apple"))))'.dependencies]
ureq = { workspace = true, optional = true, features = ["platform-verifier"] }
rustls-platform-verifier = { workspace = true, optional = true }

[dev-dependencies]
# An application runtime with worker threads, for the reqwest transport's tests.
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
# The TLS server under a private certificate authority in the trust tests.
rustls = { workspace = true, features = ["aws-lc-rs", "std", "tls12"] }
lsr-core = { workspace = true, features = ["testing"] }
# Integration tests need FakeS3 and the fault layer, which sit behind the feature.
lsr-store-s3 = { workspace = true, features = ["testing"] }
proptest = { workspace = true, features = ["default"] }
# Shared credential files for the credential chain tests.
tempfile.workspace = true
# The recover count names the WAL reader type its None argument needs.
lsr-wal.workspace = true
# The memory gate for compaction reads its inputs from a directory, as the engine does.
lsr-store-fs.workspace = true

# Schedule exploration: `send_on_threads` runs on shuttle's scheduler under `--cfg shuttle`
# (`just shuttle`). A normal dependency, since the library code names it, but only for that cfg,
# which no other build sets.
[target.'cfg(shuttle)'.dependencies]
shuttle.workspace = true

[lints]
workspace = true
