[package]
name = "lsr-store-s3"
version = "0.0.0"
description = "ObjectStore on an S3-compatible bucket: sans-IO requests, responses and error classification."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The in-memory S3 (FakeS3), the recorded-fault layer and test-only request edits.
testing = []

[dependencies]
lsr-core = { path = "../core" }
lsr-ltx = { path = "../ltx" }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
md-5 = { version = "0.11", default-features = false }
percent-encoding = "2"
rusty-s3 = { version = "0.11", default-features = false, features = ["rustcrypto", "full"] }
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
zeroize = "1"

[dev-dependencies]
lsr-core = { path = "../core", features = ["testing"] }
# Integration tests need FakeS3 and the fault layer, which sit behind the feature.
lsr-store-s3 = { path = ".", features = ["testing"] }
proptest = "1"

[lints]
workspace = true
