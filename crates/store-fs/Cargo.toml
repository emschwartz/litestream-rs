[package]
name = "lsr-store-fs"
version = "0.0.0"
description = "ObjectStore on a directory laid out as Litestream's file replica."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lsr-core.workspace = true
lsr-ltx.workspace = true
# The free space of the staging disk (`statvfs`), through safe calls.
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
lsr-core = { workspace = true, features = ["testing"] }
lsr-wal.workspace = true
tempfile.workspace = true

[lints]
workspace = true
